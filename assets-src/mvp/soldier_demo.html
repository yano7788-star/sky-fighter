<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>탑다운 슈터 — 맵 테스트</title>
<style>
  :root {
    --bg: #eceae4; --ink: #1d211a; --muted: #5d6354; --panel: #fbfaf6; --line: #c9c6ba;
    --accent: #3f5a2a; --accent-ink: #f3f6ee;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14170f; --ink: #e7eadc; --muted: #9aa18a; --panel: #1d2117; --line: #333a28;
      --accent: #8fb15f; --accent-ink: #11160b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14170f; --ink: #e7eadc; --muted: #9aa18a; --panel: #1d2117; --line: #333a28;
    --accent: #8fb15f; --accent-ink: #11160b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none;
    font: 15px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 14px 24px; }
  h1 { font-size: 19px; margin: 0 0 2px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .bar .sp { flex: 1; min-width: 6px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    padding: 6px 11px; border-radius: 6px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stage { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0b0c10;
           -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100%; height: min(66vh, 600px); min-height: 320px; cursor: none; touch-action: none; }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,9,12,.66); color: #e7eadc; font-size: 17px; pointer-events: none; text-align: center; padding: 20px; line-height: 1.6;
  }
  .status { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; color: var(--muted); font-size: 14px; }
  .status b { color: var(--ink); font-weight: 600; }
  .keys { margin-top: 4px; color: var(--muted); font-size: 13px; }

  /* 터치 UI */
  #tbar { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px));
          display: none; flex-direction: column; gap: 10px; }
  #stage.touch #tbar { display: flex; }
  .tb { width: 62px; height: 62px; border-radius: 50%; background: rgba(18,22,30,.62); color: #fff; border: 2px solid rgba(255,255,255,.5);
        font-size: 13px; padding: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
  .tb:active { background: rgba(255,255,255,.35); }
  body.touch main { padding: 6px; }
  body.touch h1, body.touch .sub, body.touch .keys, body.touch .status { display: none; }
  body.touch canvas { height: calc(100vh - 54px); height: calc(100dvh - 54px); min-height: 200px; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>탑다운 슈터 — 맵 테스트</h1>
  <p class="sub">문·창문·상자는 부서지고 벽은 안 부서집니다. 총이 벽에 겹치면 자동으로 내려갑니다.</p>

  <div class="bar" role="group" aria-label="무기와 행동">
    <button id="w-shotgun" aria-pressed="true">1 샷건</button>
    <button id="w-pistol" aria-pressed="false">2 권총</button>
    <button id="w-rifle" aria-pressed="false">3 소총</button>
    <button id="w-smg" aria-pressed="false">4 SMG</button>
    <span class="sp"></span>
    <button id="touchui" aria-pressed="false">터치 UI</button>
    <button id="mode" aria-pressed="false">회전: 자유</button>
    <button id="reset">다시 시작</button>
  </div>

  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="게임 화면"></canvas>
    <div id="tbar">
      <button class="tb" id="t-roll">구르기</button>
      <button class="tb" id="t-melee">근접</button>
      <button class="tb" id="t-bomb">폭탄</button>
      <button class="tb" id="t-weapon">샷건</button>
    </div>
    <div id="hint">화면을 터치(클릭)하면 시작합니다<br>왼쪽 스틱: 이동 · 오른쪽 스틱: 조준 (끝까지 밀면 발사)</div>
  </div>

  <div class="status">
    <span>무기 <b id="s-weapon">샷건</b></span>
    <span>동작 <b id="s-pose">대기</b></span>
    <span>남은 적 <b id="s-left">0</b></span>
    <span>맞은 횟수 <b id="s-taken">0</b></span>
  </div>
  <div class="keys">WASD: 이동 · 마우스: 조준 · 클릭: 발사 · 우클릭/F: 근접(문 걷어차기) · Space/Shift: 구르기 · G: 폭탄 · 1~4: 무기 · R: 회전 방식 · 문은 몸으로 밀면 열림</div>
</main>

  function buildLayers() {
    floorC.width = wallC.width = WORLD_W; floorC.height = wallC.height = WORLD_H;
    const f = floorC.getContext("2d"), w = wallC.getContext("2d");
    const NEON = { ".": "#8a93a6", r: "#ff3d9a", y: "#ffb347", g: "#2dffb4", b: "#3db8ff" };
    const FL = { ".": ["#2a2c33", "#24262c"], r: ["#4b1e3f", "#431a38"], y: ["#5b412b", "#523a26"], g: ["#1f4b43", "#1b423b"], b: ["#1f3858", "#1b3150"] };
    f.fillStyle = "#0a0b0e"; f.fillRect(0, 0, WORLD_W, WORLD_H);
    for (let cy = 0; cy < ROWSN; cy++) for (let cx = 0; cx < COLS; cx++) {
      const ch = gridCh(cx, cy); if (ch === "#") continue;
      const p = FL[ch] || FL["."], x = cx * T, y = cy * T;
      f.fillStyle = p[(cx + cy) & 1]; f.fillRect(x, y, T, T);
      if (ch === "y") { f.fillStyle = "rgba(0,0,0,.24)"; for (let k = 1; k < 4; k++) f.fillRect(x, y + k * 16 - 1, T, 2); }
      else { f.fillStyle = "rgba(0,0,0,.2)"; f.fillRect(x, y, T, 2); f.fillRect(x, y, 2, T); }
    }
    for (let cy = 0; cy < ROWSN; cy++) for (let cx = 0; cx < COLS; cx++) {
      if (!isWall(cx, cy)) continue;
      f.fillStyle = "rgba(0,0,0,.4)"; f.fillRect(cx * T + 9, cy * T + 9, T, T);          // 벽이 바닥에 드리우는 그림자
    }
    for (let cy = 0; cy < ROWSN; cy++) for (let cx = 0; cx < COLS; cx++) {
      if (!isWall(cx, cy)) continue;
      const x = cx * T, y = cy * T;
      w.fillStyle = "#14161b"; w.fillRect(x, y, T, T);
      const sides = [[0, -1, x, y, T, 2], [0, 1, x, y + T - 2, T, 2], [-1, 0, x, y, 2, T], [1, 0, x + T - 2, y, 2, T]];
      for (const [dx, dy, rx, ry, rw, rh] of sides) {
        const n = gridCh(cx + dx, cy + dy); if (n === "#") continue;
        w.fillStyle = "#2a2f3a"; // 윗면 하이라이트
        if (dy === -1) w.fillRect(x, y + 2, T, 3); else if (dx === -1) w.fillRect(x + 2, y, 3, T);
        else if (dy === 1) w.fillRect(x, y + T - 5, T, 3); else w.fillRect(x + T - 5, y, 3, T);
        w.globalAlpha = 0.28; w.fillStyle = NEON[n] || NEON["."];                         // 네온 글로우
        if (dy === -1) w.fillRect(x, y + 2, T, 5); else if (dx === -1) w.fillRect(x + 2, y, 5, T);
        else if (dy === 1) w.fillRect(x, y + T - 7, T, 5); else w.fillRect(x + T - 7, y, 5, T);
        w.globalAlpha = 0.95; w.fillStyle = NEON[n] || NEON["."]; w.fillRect(rx, ry, rw, rh);
        w.globalAlpha = 1;
      }
    }

  // ===== 오브젝트 =====
  function makeDoor(c, r, o) {
    const d = { o, hp: 12, phi: 0, tgt: 0, spd: 420, state: "closed", flash: 0 };
    if (o === "v") { d.x = c * T; d.y = r * T; d.w = T; d.h = 2 * T; d.hx = c * T + T / 2; d.hy = r * T; d.u = [0, 1]; d.n = [1, 0]; }
    else           { d.x = c * T; d.y = r * T; d.w = 2 * T; d.h = T; d.hx = c * T; d.hy = r * T + T / 2; d.u = [1, 0]; d.n = [0, 1]; }
    d.blocks = function () { return this.state !== "broken" && Math.abs(this.phi) < 45; };
    d.open = function (mover, fast) {
      if (this.state === "broken" || this.tgt !== 0) return;
      const side = this.o === "v" ? (mover.x < this.x + this.w / 2 ? 1 : -1) : (mover.y < this.y + this.h / 2 ? 1 : -1);   // 밀고 있는 쪽의 반대로 열림
      this.tgt = 100 * side; this.spd = fast ? 900 : 420; this.state = "open";
      if (fast) noise(this.x + this.w / 2, this.y + this.h / 2, 450);
    };
    return d;
  }
  function makeWindow(c, r, o) {
    const w = { o, hp: 2, broken: false };
    if (o === "v") { w.x = c * T; w.y = r * T; w.w = T; w.h = 2 * T; } else { w.x = c * T; w.y = r * T; w.w = 2 * T; w.h = T; }
    return w;
  }
  function loadLevel() {
    doors = MAP.doors.map(([c, r, o]) => makeDoor(c, r, o));
    windows = MAP.windows.map(([c, r, o]) => makeWindow(c, r, o));
    crates = MAP.crates.map(([c, r]) => ({ x: c * T + 4, y: r * T + 4, w: 56, h: 56, hp: 3, hit: 0, dead: false, cx: c, cy: r }));
    winCell.fill(undefined); crateCell.fill(undefined);
    for (const w of windows) for (let cy = Math.floor(w.y / T); cy < Math.ceil((w.y + w.h) / T); cy++) for (let cx = Math.floor(w.x / T); cx < Math.ceil((w.x + w.w) / T); cx++) winCell[cy * COLS + cx] = w;
    for (const c of crates) crateCell[c.cy * COLS + c.cx] = c;
  }

  function obstacleAt(x, y) {
    const cx = Math.floor(x / T), cy = Math.floor(y / T);
    if (isWall(cx, cy)) return { type: "wall" };
    for (const d of doors) if (d.blocks() && inRect(x, y, d)) return { type: "door", obj: d };
    for (const c of crates) if (!c.dead && inRect(x, y, c)) return { type: "crate", obj: c };
    for (const w of windows) if (!w.broken && inRect(x, y, w)) return { type: "window", obj: w };

  }

  function sparks(x, y, n) { for (let i = 0; i < n; i++) { const a = rand(0, 6.283), v = rand(60, 200); parts.push({ kind: "spark", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.15, 0.3), max: 0.3 }); } }
  function dust(x, y) { parts.push({ kind: "dust", x, y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.3, max: 0.3 }); }

  // ===== 그리기 =====
  function drawLayer(img, cam, w, h) {
    const sx = Math.max(0, cam.x), sy = Math.max(0, cam.y), ex = Math.min(WORLD_W, cam.x + w), ey = Math.min(WORLD_H, cam.y + h);
    if (ex <= sx || ey <= sy) return;
    ctx.drawImage(img, sx, sy, ex - sx, ey - sy, sx - cam.x, sy - cam.y, ex - sx, ey - sy);
  }
  function drawCrate(c, cam) {
    if (c.dead) return;
    const x = c.x - cam.x, y = c.y - cam.y;
    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(x + 6, y + 7, c.w, c.h);
    ctx.fillStyle = c.hit > 0 ? "#f1ead8" : "#8a5a2e"; ctx.fillRect(x, y, c.w, c.h);
    ctx.strokeStyle = c.hit > 0 ? "#bdb49c" : "#4b2f16"; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y + 2, c.w - 4, c.h - 4);
    ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + c.w - 4, y + c.h - 4); ctx.moveTo(x + c.w - 4, y + 4); ctx.lineTo(x + 4, y + c.h - 4); ctx.stroke();
    if (c.hp < 3) { ctx.strokeStyle = "rgba(20,10,4,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 10, y + 6); ctx.lineTo(x + 24, y + 26); ctx.lineTo(x + 18, y + 44); ctx.stroke(); }
  }
  function drawWindow(w, cam) {
    const x = w.x - cam.x, y = w.y - cam.y;
    if (w.broken) {                                   // 깨진 창: 양쪽 프레임 조각만 남음
      ctx.fillStyle = "#1c242c";
      if (w.o === "h") { ctx.fillRect(x, y + 22, 8, 20); ctx.fillRect(x + w.w - 8, y + 22, 8, 20); }
      else { ctx.fillRect(x + 22, y, 20, 8); ctx.fillRect(x + 22, y + w.h - 8, 20, 8); }
      return;
    }
    ctx.fillStyle = "#0d1f2a"; ctx.fillRect(x, y, w.w, w.h);
    ctx.fillStyle = "rgba(130,225,245,.45)";
    if (w.o === "h") ctx.fillRect(x + 4, y + 20, w.w - 8, 24); else ctx.fillRect(x + 20, y + 4, 24, w.h - 8);
    ctx.strokeStyle = "#2b3a46"; ctx.lineWidth = 4;
    if (w.o === "h") { ctx.strokeRect(x + 3, y + 19, w.w - 6, 26); ctx.beginPath(); ctx.moveTo(x + w.w / 2, y + 19); ctx.lineTo(x + w.w / 2, y + 45); ctx.stroke(); }
    else { ctx.strokeRect(x + 19, y + 3, 26, w.h - 6); ctx.beginPath(); ctx.moveTo(x + 19, y + w.h / 2); ctx.lineTo(x + 45, y + w.h / 2); ctx.stroke(); }
    ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 2; ctx.beginPath();
    if (w.o === "h") { ctx.moveTo(x + 14, y + 40); ctx.lineTo(x + 30, y + 24); ctx.moveTo(x + w.w / 2 + 14, y + 40); ctx.lineTo(x + w.w / 2 + 30, y + 24); }
    else { ctx.moveTo(x + 24, y + 14); ctx.lineTo(x + 40, y + 30); }
    ctx.stroke();
    if (w.hp < 2) { ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w.w / 2 - 10, y + w.h / 2 - 8); ctx.lineTo(x + w.w / 2 + 4, y + w.h / 2 + 2); ctx.lineTo(x + w.w / 2 - 2, y + w.h / 2 + 12); ctx.stroke(); }
  }
  function drawDoor(d, cam) {
    const hx = d.hx - cam.x, hy = d.hy - cam.y;
    if (d.state === "broken") { ctx.fillStyle = "#2a1a0e"; ctx.beginPath(); ctx.arc(hx, hy, 7, 0, 6.283); ctx.fill(); return; }
    const ph = d.phi * Math.PI / 180, c = Math.cos(ph), s = Math.sin(ph), L = 2 * T;
    const ex = hx + (d.u[0] * c + d.n[0] * s) * L, ey = hy + (d.u[1] * c + d.n[1] * s) * L;
    ctx.save(); ctx.lineCap = "butt";
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(hx + 6, hy + 7); ctx.lineTo(ex + 6, ey + 7); ctx.stroke();
    ctx.strokeStyle = "#2a1608"; ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = d.flash > 0 ? "#e8c9a0" : d.hp < 6 ? "#6d4426" : "#8a5a30"; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = "#c9a24a"; ctx.beginPath(); ctx.arc(hx + (ex - hx) * 0.88, hy + (ey - hy) * 0.88, 3, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#1a1a1e"; ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function drawBomb(b, cam) {
    const x = b.x - cam.x, y = b.y - cam.y;
    if (b.boom) {
      const k = Math.min(6, Math.floor(b.te / 0.075)), size = 64 * 3;
      const fade = b.te > 0.45 ? Math.max(0, 1 - (b.te - 0.45) / 0.25) : 1;
      if (b.te < 0.25) {
        const g = ctx.createRadialGradient(x, y, 4, x, y, 230); g.addColorStop(0, "rgba(255,200,90,.55)"); g.addColorStop(1, "rgba(255,200,90,0)");
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - 230, y - 230, 460, 460); ctx.restore();
      }
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = fade;
      ctx.drawImage(IMGS.explosion, k * 64, 0, 64, 64, x - size / 2, y - size / 2, size, size); ctx.restore(); return;
    }
    const z = b.z;
    ctx.fillStyle = `rgba(0,0,0,${0.4 * (1 - 0.55 * z)})`;
    ctx.beginPath(); ctx.ellipse(x, y + 4, 15 * (1 - 0.3 * z), 11 * (1 - 0.3 * z), 0, 0, 6.283); ctx.fill();
    const sc = SCALE * (1 + 1.1 * z), size = 12 * sc;
    const rate = 3 + 12 * Math.pow(b.t / b.fuse, 2), blink = b.t > b.flight && Math.floor(b.t * rate * 2) % 2 === 0 ? 1 : 0;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(x, y - z * 38); ctx.rotate(b.t * 5);
    ctx.drawImage(IMGS.bomb, blink * 12, 0, 12, 12, -size / 2, -size / 2, size, size); ctx.restore();
  }

  function drawPlayer(cam, vw, vh) {
    const pose = currentPose(), isThrow = pose.startsWith("throw"), isRoll = pose.startsWith("roll");
    const key = isRoll ? "roll" : isThrow ? "throw" : weapon;
    const sh = SHEETS[key], img = IMGS[key];
    const a = isRoll ? (snap ? Math.round(rollAngle / (Math.PI / 2)) * (Math.PI / 2) : rollAngle) : effAngle();
    const row = sh.rows[pose], size = sh.S * SCALE;
    const px = player.x - cam.x, py = player.y - cam.y;
    ctx.save(); ctx.translate(px + 4, py + 6); ctx.rotate(a);
    ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.beginPath(); ctx.ellipse(0, 0, 20, 38, 0, 0, 6.283); ctx.fill(); ctx.restore();
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(Math.round(px), Math.round(py));
    if (snap) ctx.drawImage(img, COL[dirName(a)] * sh.S, row * sh.S, sh.S, sh.S, -size / 2, -size / 2, size, size);
    else { ctx.rotate(a); ctx.drawImage(img, COL.right * sh.S, row * sh.S, sh.S, sh.S, -size / 2, -size / 2, size, size); }
    ctx.restore();
    if (flash > 0 && !gunBlocked && !isRoll) {
      const W = WEAPONS[weapon], [mx, my] = toWorld(W.muzzle[0] * SCALE, W.muzzle[1] * SCALE, a);
      const g = ctx.createRadialGradient(mx - cam.x, my - cam.y, 2, mx - cam.x, my - cam.y, weapon === "shotgun" ? 150 : 100);
      g.addColorStop(0, "rgba(255,210,110,.55)"); g.addColorStop(1, "rgba(255,210,110,0)");
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh); ctx.restore();
    }
  }

  function drawCrosshair() {
    const r = 9 + aimKick * 12, x = mouse.x, y = mouse.y, bad = gunBlocked;
    ctx.save(); ctx.lineCap = "square";
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass ? (bad ? "rgba(255,110,110,.95)" : "rgba(255,255,255,.95)") : "rgba(0,0,0,.55)"; ctx.lineWidth = pass ? 2 : 4;
      ctx.beginPath(); ctx.moveTo(x - r - 6, y); ctx.lineTo(x - r, y); ctx.moveTo(x + r, y); ctx.lineTo(x + r + 6, y);
      ctx.moveTo(x, y - r - 6); ctx.lineTo(x, y - r); ctx.moveTo(x, y + r); ctx.lineTo(x, y + r + 6); ctx.stroke();
    }
    ctx.fillStyle = bad ? "#ff6e6e" : "#fff"; ctx.fillRect(x - 1, y - 1, 3, 3);
    if (hitMark.t > 0) {
      const k = hitMark.t / (hitMark.kill ? 0.3 : 0.14), g = (hitMark.kill ? 10 : 6) + (1 - k) * 6, L = hitMark.kill ? 11 : 7;
      ctx.strokeStyle = hitMark.kill ? "rgba(255,70,70,.95)" : "rgba(255,255,255,.95)"; ctx.lineWidth = hitMark.kill ? 3 : 2; ctx.beginPath();
      for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { ctx.moveTo(x + sx * g, y + sy * g); ctx.lineTo(x + sx * (g + L), y + sy * (g + L)); }
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawSticks() {
    const defs = [["move", 110, VH - 110], ["aim", VW - 110, VH - 110]];
    for (const [k, hx, hy] of defs) {
      const s = touch[k];
      ctx.save();
      ctx.globalAlpha = s ? 0.3 : 0.14; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.fillStyle = "#fff";
      const bx = s ? s.ox : hx, by = s ? s.oy : hy;
      ctx.beginPath(); ctx.arc(bx, by, STICK_R, 0, 6.283); ctx.stroke();
      if (s) {
        const v = stickVec(s), kx = bx + Math.cos(v.a) * v.m * STICK_R, ky = by + Math.sin(v.a) * v.m * STICK_R;
        ctx.globalAlpha = 0.45; ctx.fillStyle = k === "aim" && v.m > 0.55 ? (gunBlocked ? "#ff6e6e" : "#ffd24a") : "#fff";
        ctx.beginPath(); ctx.arc(kx, ky, 24, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
  }

  function draw() {
    const vw = VW / zoom, vh = VH / zoom;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, VW, VH);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
    const c0 = camera(), sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    const cam = { x: Math.round(c0.x + sx + kick.x), y: Math.round(c0.y + sy + kick.y) };
    ctx.imageSmoothingEnabled = false;
    drawLayer(floorC, cam, vw, vh);
    drawLayer(decal, cam, vw, vh);
    for (const c of crates) drawCrate(c, cam);
    for (const w of windows) drawWindow(w, cam);
    for (const d of doors) drawDoor(d, cam);
    for (const b of bombs) if (b.boom || b.z < 0.02) drawBomb(b, cam);
    for (const e of enemies) if (e.state === "dying") drawEnemy(e, cam);
    for (const e of enemies) if (e.state === "alive") drawEnemy(e, cam);

    for (const p of parts) {
      const k = Math.max(0, p.life / p.max), x = p.x - cam.x, y = p.y - cam.y;
      if (p.kind === "casing") {
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + (1 - k) * 6); ctx.globalAlpha = Math.min(1, k * 2);
        ctx.fillStyle = "#d6a838"; ctx.fillRect(-5, -3, 10, 6); ctx.fillStyle = "#96701e"; ctx.fillRect(-5, -3, 3, 6); ctx.restore();
      } else if (p.kind === "spark") { ctx.fillStyle = `rgba(255,${Math.round(180 + 60 * k)},90,${k})`; ctx.fillRect(x - 2, y - 2, 4, 4); }
      else if (p.kind === "blood") { ctx.strokeStyle = "rgba(170,16,24,.95)"; ctx.lineWidth = p.size; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * 0.022, y - p.vy * 0.022); ctx.stroke(); }
      else if (p.kind === "mist") { ctx.fillStyle = `rgba(150,14,20,${0.38 * k})`; ctx.beginPath(); ctx.arc(x, y, 10 + (1 - k) * 26, 0, 6.283); ctx.fill(); }
      else if (p.kind === "gib") { ctx.fillStyle = "#3a0508"; ctx.fillRect(x - p.size / 2 - 1, y - p.size / 2 - 1, p.size + 2, p.size + 2); ctx.fillStyle = "#a31018"; ctx.fillRect(x - p.size / 2, y - p.size / 2, p.size, p.size); }
      else if (p.kind === "glass") { ctx.fillStyle = `rgba(190,240,255,${Math.min(1, k * 1.6)})`; ctx.fillRect(x, y, p.size, p.size * 0.6); }
      else if (p.kind === "dust") { ctx.fillStyle = `rgba(190,190,200,${0.5 * k})`; ctx.beginPath(); ctx.arc(x, y, 6 + (1 - k) * 12, 0, 6.283); ctx.fill(); }
      else { ctx.fillStyle = `rgba(138,90,46,${k})`; ctx.fillRect(x - 3, y - 3, 6, 6); }
    }
    ctx.lineCap = "round";
    for (const b of bullets) { const l = Math.hypot(b.vx, b.vy), x = b.x - cam.x, y = b.y - cam.y; ctx.strokeStyle = "rgba(255,238,150,.95)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - b.vx / l * b.len, y - b.vy / l * b.len); ctx.stroke(); }
    for (const b of ebullets) { const l = Math.hypot(b.vx, b.vy), x = b.x - cam.x, y = b.y - cam.y; ctx.strokeStyle = "rgba(255,120,80,.95)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - b.vx / l * 22, y - b.vy / l * 22); ctx.stroke(); }
    drawPlayer(cam, vw, vh);
    drawLayer(wallC, cam, vw, vh);                         // 벽은 맨 위: 혹시 겹쳐도 벽 아래로 가려짐
    for (const b of bombs) if (!b.boom && b.z >= 0.02) drawBomb(b, cam);
    if (dodgeT > 0) {                                      // 회피 성공 표시
      const k = dodgeT / 0.6;
      ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.fillStyle = `rgba(120,230,255,${Math.min(1, k * 1.5)})`;
      ctx.strokeText("회피!", player.x - cam.x, player.y - cam.y - 58 - (1 - k) * 20); ctx.fillText("회피!", player.x - cam.x, player.y - cam.y - 58 - (1 - k) * 20);
    }
    for (const r of rings) { const k = r.t / 0.35; ctx.strokeStyle = `rgba(255,240,210,${0.6 * (1 - k)})`; ctx.lineWidth = 6 * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x - cam.x, r.y - cam.y, 30 + k * 190, 0, 6.283); ctx.stroke(); }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);               // ---- 화면 고정 UI ----
    if (redFlash > 0) {
      const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
      g.addColorStop(0, "rgba(180,0,0,0)"); g.addColorStop(1, `rgba(180,0,0,${Math.min(0.55, redFlash * 1.8)})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    }
    if (active && !touch.on) drawCrosshair();
    if (touch.on) drawSticks();
    if (screenFlash > 0) { ctx.fillStyle = `rgba(255,244,214,${Math.min(0.45, screenFlash * 2)})`; ctx.fillRect(0, 0, VW, VH); }
    let alive = 0; for (const e of enemies) if (e.state === "alive") alive++;
    ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left"; ctx.strokeStyle = "rgba(0,0,0,.8)"; ctx.lineWidth = 4; ctx.fillStyle = "#fff";
    const hud = `남은 적 ${alive}   맞은 횟수 ${taken}`;
    ctx.strokeText(hud, 12, 24); ctx.fillText(hud, 12, 24);
    if (cleared) {
      ctx.textAlign = "center"; ctx.font = "bold 44px sans-serif"; ctx.lineWidth = 6; ctx.fillStyle = "#ffd24a";
      ctx.strokeText("클리어!", VW / 2, VH / 2 - 6); ctx.fillText("클리어!", VW / 2, VH / 2 - 6);
      ctx.font = "bold 18px sans-serif"; ctx.fillStyle = "#fff"; ctx.lineWidth = 4;
      if (clearT > 1) { ctx.strokeText("화면을 터치하면 다시 시작", VW / 2, VH / 2 + 30); ctx.fillText("화면을 터치하면 다시 시작", VW / 2, VH / 2 + 30); }
    }
  }

  let last = 0;
  function loop(t) {
    const real = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    hitStopT = Math.max(0, hitStopT - real); slowT = Math.max(0, slowT - real);
    const scale = hitStopT > 0 ? 0.05 : slowT > 0 ? 0.4 : 1;
    update(real * scale); draw(); requestAnimationFrame(loop);
  }
  function start() {
    buildLayers(); resetAll();
    if (mq && mq.matches) setTouchUI(true); else resize();
    mouse.x = VW * 0.75; mouse.y = VH * 0.5;
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
