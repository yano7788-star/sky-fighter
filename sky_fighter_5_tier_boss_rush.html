<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sky Fighter: 5-Tier Boss Rush</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050811; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="pngLoader" style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;display:none;background:rgba(5,8,17,.94);color:#fff;padding:12px 14px;border-radius:12px;text-align:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.35);">
    <div style="margin-bottom:8px">보스 PNG를 불러오지 못했습니다.</div>
    <button id="pngPickBtn" style="padding:9px 14px;border:0;border-radius:8px;font-weight:700">boss1~boss5.png 선택</button>
    <input id="pngPicker" type="file" accept="image/png,image/*" multiple style="display:none">
  </div>
  <script>

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const playerImg = new Image();
    let isPlayerImgLoaded = false;
    playerImg.src = 'player.png';
    playerImg.onload = () => { isPlayerImgLoaded = true; };

    const bossImages = {};
    const bossImgLoaded = {};
    const bossImgFailed = {};
    for (let i = 1; i <= 5; i++) {
      bossImages[i] = new Image();
      bossImgLoaded[i] = false;
      bossImgFailed[i] = false;
      bossImages[i].onload = () => { bossImgLoaded[i] = true; bossImgFailed[i] = false; };
      bossImages[i].onerror = () => { bossImgFailed[i] = true; showPngLoader(); };
      bossImages[i].src = `./boss${i}.png`;
    }

    const pngLoader = document.getElementById('pngLoader');
    const pngPickBtn = document.getElementById('pngPickBtn');
    const pngPicker = document.getElementById('pngPicker');
    function showPngLoader(){ if(pngLoader) pngLoader.style.display='block'; }
    function hidePngLoader(){ if(pngLoader) pngLoader.style.display='none'; }
    pngPickBtn.addEventListener('click',()=>pngPicker.click());
    pngPicker.addEventListener('change', e => {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        const m = file.name.match(/^boss([1-5])\.(png|jpg|jpeg|webp)$/i);
        if(!m) return;
        const tier = Number(m[1]);
        const url = URL.createObjectURL(file);
        bossImages[tier].onload = () => { bossImgLoaded[tier] = true; bossImgFailed[tier] = false; hidePngLoader(); };
        bossImages[tier].onerror = () => { bossImgFailed[tier] = true; };
        bossImages[tier].src = url;
      });
    });

    setTimeout(()=>{ if(Object.values(bossImgFailed).some(Boolean)) showPngLoader(); },1500);

    let audioCtx = null, bgmGain = null, isMuted = false, bgmStep = 0, nextNoteTime = 0, isBgmRunning = false;
    const NOTES = {
      C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
      C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
      C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,REST:0
    };
    const normalBgmNotes = [
      {bass:NOTES.A3,lead:NOTES.A4},{bass:NOTES.A3,lead:NOTES.C5},{bass:NOTES.A3,lead:NOTES.E5},{bass:NOTES.A3,lead:NOTES.A4},
      {bass:NOTES.F3,lead:NOTES.F4},{bass:NOTES.F3,lead:NOTES.A4},{bass:NOTES.F3,lead:NOTES.C5},{bass:NOTES.F3,lead:NOTES.F5},
      {bass:NOTES.G3,lead:NOTES.G4},{bass:NOTES.G3,lead:NOTES.B4},{bass:NOTES.G3,lead:NOTES.D5},{bass:NOTES.G3,lead:NOTES.G5},
      {bass:NOTES.E3,lead:NOTES.E4},{bass:NOTES.E3,lead:NOTES.G4},{bass:NOTES.E3,lead:NOTES.B4},{bass:NOTES.E3,lead:NOTES.E5}
    ];
    const bossBgmNotes = [
      {bass:NOTES.D3,lead:NOTES.D5},{bass:NOTES.D3,lead:NOTES.REST},{bass:NOTES.D3,lead:NOTES.F5},{bass:NOTES.D3,lead:NOTES.D5},
      {bass:NOTES.C3,lead:NOTES.C5},{bass:NOTES.C3,lead:NOTES.REST},{bass:NOTES.C3,lead:NOTES.E5},{bass:NOTES.C3,lead:NOTES.C5},
      {bass:NOTES.B3,lead:NOTES.B4},{bass:NOTES.B3,lead:NOTES.REST},{bass:NOTES.B3,lead:NOTES.D5},{bass:NOTES.B3,lead:NOTES.B4},
      {bass:NOTES.C3,lead:NOTES.C5},{bass:NOTES.D3,lead:NOTES.D5},{bass:NOTES.E3,lead:NOTES.E5},{bass:NOTES.F3,lead:NOTES.F5}
    ];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmGain = audioCtx.createGain();
        bgmGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        bgmGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!isBgmRunning) { isBgmRunning = true; nextNoteTime = audioCtx.currentTime + 0.05; }
    }
    function playTone(freq,type,duration,startTime,vol=0.1) {
      if (!audioCtx || freq===0 || isMuted) return;
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.type=type; osc.frequency.setValueAtTime(freq,startTime);
      gain.gain.setValueAtTime(vol,startTime);
      gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration);
      osc.connect(gain); gain.connect(bgmGain); osc.start(startTime); osc.stop(startTime+duration);
    }
    function updateBgmScheduler() {
      if (!isBgmRunning || !audioCtx) return;
      const tempo=boss?155:130, stepDuration=60/tempo/4;
      while(nextNoteTime<audioCtx.currentTime+0.15) {
        const pattern=boss?bossBgmNotes:normalBgmNotes, currentStep=pattern[bgmStep%pattern.length];
        playTone(currentStep.bass,'triangle',stepDuration*0.9,nextNoteTime,0.22);
        playTone(currentStep.lead,'square',stepDuration*0.6,nextNoteTime,0.08);
        nextNoteTime+=stepDuration; bgmStep++;
      }
    }
    function playSound(type) {
      if (!audioCtx || isMuted) return;
      try {
        const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); const t=audioCtx.currentTime;
        if(type==='laser'){osc.type='square';osc.frequency.setValueAtTime(800,t);osc.frequency.exponentialRampToValueAtTime(200,t+0.07);gain.gain.setValueAtTime(0.07,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.07);osc.start(t);osc.stop(t+0.07);}
        else if(type==='missile'){osc.type='sawtooth';osc.frequency.setValueAtTime(280,t);osc.frequency.exponentialRampToValueAtTime(600,t+0.1);gain.gain.setValueAtTime(0.1,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.1);osc.start(t);osc.stop(t+0.1);}
        else if(type==='boom'){osc.type='sawtooth';osc.frequency.setValueAtTime(140,t);osc.frequency.exponentialRampToValueAtTime(30,t+0.25);gain.gain.setValueAtTime(0.25,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.25);osc.start(t);osc.stop(t+0.25);}
        else if(type==='item'){osc.type='sine';osc.frequency.setValueAtTime(440,t);osc.frequency.exponentialRampToValueAtTime(1100,t+0.16);gain.gain.setValueAtTime(0.18,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.16);osc.start(t);osc.stop(t+0.16);}
        else if(type==='heal'){osc.type='sine';osc.frequency.setValueAtTime(300,t);osc.frequency.exponentialRampToValueAtTime(800,t+0.25);gain.gain.setValueAtTime(0.2,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.25);osc.start(t);osc.stop(t+0.25);}
      } catch(e){}
    }

    const stars=Array.from({length:65},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.8+0.5,speed:Math.random()*2+0.8}));
    let score=0,weaponLevel=1,hasHomingMissile=false,missileTimer=0,isGameOver=false,frame=0;
    let bossTier=1,boss=null,nextBossScore=250,bossWarningTimer=0;
    const BOSS_CONFIGS={
      1:{name:'STAGE 1: TANK BUSTER',hp:80,color:'#4d7c0f',subColor:'#bef264',w:125,h:90,shotCd:40},
      2:{name:'STAGE 2: HEAVY DESTROYER',hp:160,color:'#b91c1c',subColor:'#f87171',w:135,h:95,shotCd:35},
      3:{name:'STAGE 3: CYBER STEALTH',hp:260,color:'#0284c7',subColor:'#38bdf8',w:145,h:95,shotCd:30},
      4:{name:'STAGE 4: AEGIS FLAGSHIP',hp:400,color:'#ca8a04',subColor:'#facc15',w:155,h:105,shotCd:26},
      5:{name:'STAGE 5: VOID ARCHANGEL',hp:650,color:'#7e22ce',subColor:'#c084fc',w:165,h:120,shotCd:20}
    };
    const player={x:canvas.width/2,y:canvas.height-140,targetX:canvas.width/2,targetY:canvas.height-140,radius:20,energy:100,maxEnergy:100,displayEnergy:100,invincible:0};
    const bullets=[],missiles=[],enemyBullets=[],enemies=[],particles=[],items=[];

    function checkSoundButtonTap(x,y){
      const btnX=canvas.width-45,btnY=30;
      if(Math.hypot(x-btnX,y-btnY)<25){isMuted=!isMuted;if(bgmGain)bgmGain.gain.setValueAtTime(isMuted?0:0.08,audioCtx.currentTime);return true;} return false;
    }
    function handlePointer(x,y){initAudio();if(checkSoundButtonTap(x,y))return;player.targetX=x;player.targetY=y-50;}
    canvas.addEventListener('touchstart',e=>{const t=e.touches[0];if(isGameOver)restartGame();else handlePointer(t.clientX,t.clientY);},{passive:false});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!isGameOver){const t=e.touches[0];handlePointer(t.clientX,t.clientY);}},{passive:false});
    canvas.addEventListener('mousedown',e=>{initAudio();if(checkSoundButtonTap(e.clientX,e.clientY))return;if(isGameOver)restartGame();});
    canvas.addEventListener('mousemove',e=>{if(!isGameOver&&e.buttons===1)handlePointer(e.clientX,e.clientY);});

    function spawnExplosion(x,y,color,count=12){for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,spd=Math.random()*5+2;particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,r:Math.random()*3+1.5,alpha:1,color});}}
    function applyDamage(dmg){if(player.invincible>0||isGameOver)return;player.energy=Math.max(0,player.energy-dmg);player.invincible=40;playSound('boom');spawnExplosion(player.x,player.y,'#ef4444',16);if(player.energy<=0)isGameOver=true;}
    function spawnBoss(tier){bossWarningTimer=110;const config=BOSS_CONFIGS[tier];boss={tier,name:config.name,x:canvas.width/2,y:-120,targetY:135,width:config.w,height:config.h,vx:2.3+tier*0.25,hp:config.hp,maxHp:config.hp,displayHp:config.hp,shootCooldown:0,color:config.color,subColor:config.subColor,shotCdMax:config.shotCd};}
    function restartGame(){
      score=0;bossTier=1;player.energy=100;player.displayEnergy=100;player.invincible=0;weaponLevel=1;hasHomingMissile=false;missileTimer=0;boss=null;nextBossScore=250;bossWarningTimer=0;
      bullets.length=0;missiles.length=0;enemyBullets.length=0;enemies.length=0;particles.length=0;items.length=0;
      player.x=canvas.width/2;player.y=canvas.height-140;player.targetX=player.x;player.targetY=player.y;isGameOver=false;loop();
    }

    function drawPlayerFighter(x,y){
      ctx.save();ctx.translate(x,y);
      if(player.invincible>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=0.4;
      if(isPlayerImgLoaded){ctx.drawImage(playerImg,-38,-44,76,88);ctx.restore();return;}
      const s=1.05;
      [-10,10].forEach(ox=>{const flameLength=18+Math.random()*8;ctx.fillStyle='#ff6b00';ctx.beginPath();ctx.moveTo((ox-4)*s,32*s);ctx.lineTo(ox*s,(32+flameLength)*s);ctx.lineTo((ox+4)*s,32*s);ctx.closePath();ctx.fill();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.moveTo((ox-2)*s,32*s);ctx.lineTo(ox*s,(32+flameLength*.65)*s);ctx.lineTo((ox+2)*s,32*s);ctx.closePath();ctx.fill();});
      ctx.fillStyle='#334155';ctx.fillRect(-15*s,26*s,10*s,6*s);ctx.fillRect(5*s,26*s,10*s,6*s);
      [-20,20].forEach(mx=>{ctx.fillStyle='#cbd5e1';ctx.fillRect((mx-2.5)*s,-2*s,5*s,14*s);ctx.fillStyle='#ea580c';ctx.beginPath();ctx.moveTo((mx-2.5)*s,-2*s);ctx.lineTo(mx*s,-7*s);ctx.lineTo((mx+2.5)*s,-2*s);ctx.closePath();ctx.fill();});
      [-27,27].forEach(gx=>{ctx.fillStyle='#1e293b';ctx.fillRect((gx-1.5)*s,-8*s,3*s,18*s);});
      ctx.fillStyle='#0284c7';ctx.beginPath();ctx.moveTo(0,15*s);ctx.lineTo(-24*s,30*s);ctx.lineTo(-14*s,32*s);ctx.lineTo(0,24*s);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,15*s);ctx.lineTo(24*s,30*s);ctx.lineTo(14*s,32*s);ctx.lineTo(0,24*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(-24*s,30*s);ctx.lineTo(-20*s,26*s);ctx.lineTo(-16*s,31*s);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(24*s,30*s);ctx.lineTo(20*s,26*s);ctx.lineTo(16*s,31*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#38bdf8';ctx.strokeStyle='#0f172a';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(0,-12*s);ctx.lineTo(-38*s,14*s);ctx.lineTo(-33*s,18*s);ctx.lineTo(-9*s,18*s);ctx.lineTo(0,22*s);ctx.lineTo(9*s,18*s);ctx.lineTo(33*s,18*s);ctx.lineTo(38*s,14*s);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#94a3b8';ctx.fillRect(-31*s,12*s,19*s,4*s);ctx.fillRect(12*s,12*s,19*s,4*s);
      ctx.fillStyle='#ef4444';ctx.fillRect(-38*s,12*s,4*s,5*s);ctx.fillStyle='#facc15';ctx.fillRect(-34*s,12*s,3*s,5*s);ctx.fillStyle='#ef4444';ctx.fillRect(34*s,12*s,4*s,5*s);ctx.fillStyle='#facc15';ctx.fillRect(31*s,12*s,3*s,5*s);
      ctx.fillStyle='#0284c7';ctx.beginPath();ctx.moveTo(0,-36*s);ctx.lineTo(-11*s,-10*s);ctx.lineTo(-10*s,26*s);ctx.lineTo(10*s,26*s);ctx.lineTo(11*s,-10*s);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#cbd5e1';ctx.beginPath();ctx.moveTo(0,-36*s);ctx.lineTo(-5*s,-26*s);ctx.lineTo(5*s,-26*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#38bdf8';ctx.fillRect(-4*s,-14*s,8*s,36*s);
      ctx.fillStyle='#0f172a';ctx.beginPath();ctx.ellipse(0,-6*s,7.5*s,16*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7dd3fc';ctx.beginPath();ctx.ellipse(0,-6*s,6*s,14.5*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.ellipse(-2*s,-11*s,2*s,6*s,-.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0369a1';ctx.beginPath();ctx.arc(0,-8*s,3.2*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(0,-2*s,4.2*s,3*s,0,0,Math.PI*2);ctx.fill();
      if(hasHomingMissile){ctx.strokeStyle='#ec4899';ctx.lineWidth=2.5;ctx.strokeRect(-22*s,-3*s,5*s,16*s);ctx.strokeRect(17*s,-3*s,5*s,16*s);}
      ctx.restore();
    }

    function drawBossEntity(b){
      ctx.save();ctx.translate(b.x,b.y);
      if(bossImgLoaded[b.tier]){
        const img=bossImages[b.tier];
        const scale=Math.min(b.width/img.naturalWidth,b.height/img.naturalHeight);
        const dw=img.naturalWidth*scale, dh=img.naturalHeight*scale;
        ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
        ctx.restore();return;
      }
      switch(b.tier){
        case 1:ctx.fillStyle='#4b5320';ctx.beginPath();ctx.ellipse(0,0,22,45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3f4618';ctx.fillRect(-b.width/2+10,-8,b.width-20,20);[-35,35].forEach(px=>{ctx.fillStyle='#27272a';ctx.fillRect(px-9,-20,18,38);ctx.fillStyle='rgba(254,240,138,.4)';ctx.beginPath();ctx.ellipse(px,18,16,4,frame*.4,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#dc2626';[-48,-43,43,48].forEach(rx=>ctx.fillRect(rx-2,2,4,10));break;
        case 2:ctx.fillStyle='#1c1917';ctx.fillRect(-18,-35,36,75);ctx.fillStyle='#991b1b';ctx.fillRect(-b.width/2+8,-12,b.width-16,26);[-42,-22,22,42].forEach(tx=>{ctx.fillStyle='#292524';ctx.fillRect(tx-6,-26,12,40);ctx.fillStyle='#f97316';ctx.fillRect(tx-3,14,6,14+Math.random()*6);});ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(-14,-6,7,0,Math.PI*2);ctx.arc(14,-6,7,0,Math.PI*2);ctx.fill();break;
        case 3:ctx.fillStyle='#1e293b';ctx.beginPath();ctx.moveTo(0,48);ctx.lineTo(-b.width/2,-30);ctx.lineTo(-15,-42);ctx.lineTo(0,-32);ctx.lineTo(15,-42);ctx.lineTo(b.width/2,-30);ctx.closePath();ctx.fill();ctx.strokeStyle='#06b6d4';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='#22d3ee';ctx.fillRect(-22,-10,10,16);ctx.fillRect(12,-10,10,16);break;
        case 4:ctx.fillStyle='#78350f';ctx.beginPath();ctx.moveTo(0,52);ctx.lineTo(b.width/2,-15);ctx.lineTo(0,-42);ctx.lineTo(-b.width/2,-15);ctx.closePath();ctx.fill();ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.stroke();[-42,42].forEach(sx=>{ctx.fillStyle='rgba(56,189,248,.4)';ctx.beginPath();ctx.arc(sx,0,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#38bdf8';ctx.stroke();});break;
        case 5:ctx.fillStyle='#3b0764';ctx.beginPath();ctx.moveTo(0,55);ctx.lineTo(b.width/2,20);ctx.lineTo(b.width/2-10,-50);ctx.lineTo(0,-30);ctx.lineTo(-b.width/2+10,-50);ctx.lineTo(-b.width/2,20);ctx.closePath();ctx.fill();ctx.strokeStyle='#c084fc';ctx.lineWidth=2;ctx.stroke();const coreGlow=14+Math.sin(frame*.2)*4;ctx.fillStyle=frame%6<3?'#f43f5e':'#a855f7';ctx.beginPath();ctx.arc(0,2,coreGlow,0,Math.PI*2);ctx.fill();break;
      }
      ctx.restore();
    }

    function drawLeftEnergyBar(){
      const barX=16,barY=80,barWidth=14,barHeight=150;
      player.displayEnergy+=(player.energy-player.displayEnergy)*.15;
      const fillRatio=Math.max(0,Math.min(1,player.displayEnergy/player.maxEnergy)),currentFillH=barHeight*fillRatio;
      ctx.save();ctx.fillStyle='#94a3b8';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('ENG',barX+barWidth/2,barY-14);
      ctx.fillStyle='#f8fafc';ctx.font='bold 12px sans-serif';ctx.fillText(`${Math.round(player.energy)}%`,barX+barWidth/2,barY-2);
      ctx.fillStyle='rgba(15,23,42,.75)';ctx.beginPath();ctx.roundRect(barX,barY,barWidth,barHeight,7);ctx.fill();
      let energyColor=player.energy<=25?(frame%8<4?'#ef4444':'#fee2e2'):player.energy<=55?'#f59e0b':'#10b981';
      if(currentFillH>0){ctx.fillStyle=energyColor;ctx.beginPath();ctx.roundRect(barX+2,barY+(barHeight-currentFillH)+2,barWidth-4,currentFillH-4,5);ctx.fill();}
      ctx.strokeStyle=energyColor;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(barX,barY,barWidth,barHeight,7);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;for(let i=1;i<=3;i++){const tickY=barY+barHeight*(i/4);ctx.beginPath();ctx.moveTo(barX+2,tickY);ctx.lineTo(barX+barWidth-2,tickY);ctx.stroke();}ctx.restore();
    }

    function loop(){
      if(isGameOver){ctx.fillStyle='rgba(5,8,17,.88)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f87171';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.fillText('MISSION OVER',canvas.width/2,canvas.height/2-40);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText(`최종 점수: ${score}`,canvas.width/2,canvas.height/2+10);ctx.fillText(`최종 도달: STAGE ${bossTier}`,canvas.width/2,canvas.height/2+40);ctx.fillStyle='#38bdf8';ctx.font='16px sans-serif';ctx.fillText('화면을 탭하여 다시 출격',canvas.width/2,canvas.height/2+85);return;}
      frame++;if(player.invincible>0)player.invincible--;ctx.clearRect(0,0,canvas.width,canvas.height);updateBgmScheduler();
      ctx.fillStyle='#94a3b8';stars.forEach(s=>{s.y+=s.speed;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
      player.x+=(player.targetX-player.x)*.25;player.y+=(player.targetY-player.y)*.25;player.x=Math.max(35,Math.min(canvas.width-35,player.x));player.y=Math.max(45,Math.min(canvas.height-45,player.y));drawPlayerFighter(player.x,player.y);
      if(frame%8===0){playSound('laser');if(weaponLevel===1)bullets.push({x:player.x,y:player.y-35,vx:0,vy:-12});else if(weaponLevel===2){bullets.push({x:player.x-16,y:player.y-20,vx:0,vy:-12});bullets.push({x:player.x+16,y:player.y-20,vx:0,vy:-12});}else{bullets.push({x:player.x,y:player.y-35,vx:0,vy:-12});bullets.push({x:player.x-20,y:player.y-18,vx:-2,vy:-12});bullets.push({x:player.x+20,y:player.y-18,vx:2,vy:-12});}}
      if(hasHomingMissile){missileTimer--;if(missileTimer<=0)hasHomingMissile=false;if(frame%18===0){playSound('missile');missiles.push({x:player.x-24,y:player.y,vx:-3,vy:-5,speed:7.5});missiles.push({x:player.x+24,y:player.y,vx:3,vy:-5,speed:7.5});}}
      ctx.fillStyle='#fde047';for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,Math.PI*2);ctx.fill();if(b.y<-15||b.x<0||b.x>canvas.width)bullets.splice(i,1);}
      for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];let target=boss;if(!target&&enemies.length>0){let minDist=Infinity;enemies.forEach(e=>{const d=Math.hypot(e.x-m.x,e.y-m.y);if(d<minDist){minDist=d;target=e;}});}
        if(target){const desired=Math.atan2(target.y-m.y,target.x-m.x),current=Math.atan2(m.vy,m.vx);let diff=desired-current;while(diff<-Math.PI)diff+=Math.PI*2;while(diff>Math.PI)diff-=Math.PI*2;const newAng=current+diff*.14;m.vx=Math.cos(newAng)*m.speed;m.vy=Math.sin(newAng)*m.speed;}
        m.x+=m.vx;m.y+=m.vy;if(frame%2===0)particles.push({x:m.x,y:m.y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,r:2,alpha:.8,color:'#ec4899'});
        ctx.save();ctx.translate(m.x,m.y);ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);ctx.fillStyle='#f43f5e';ctx.fillRect(-2.5,-7,5,14);ctx.fillStyle='#fbcfe8';ctx.fillRect(-1.5,-9,3,4);ctx.restore();
        if(m.y<-30||m.y>canvas.height+30||m.x<-30||m.x>canvas.width+30)missiles.splice(i,1);
      }
      if(!boss&&score>=nextBossScore)spawnBoss(bossTier);
      if(bossWarningTimer>0){bossWarningTimer--;ctx.fillStyle='#ef4444';ctx.font='bold 22px sans-serif';ctx.textAlign='center';if(Math.floor(frame/10)%2===0)ctx.fillText(`⚠ WARNING: ${BOSS_CONFIGS[bossTier].name} ⚠`,canvas.width/2,canvas.height/2-80);}
      if(boss){
        if(boss.y<boss.targetY)boss.y+=1.5;else{boss.x+=boss.vx;if(boss.x<boss.width/2+10||boss.x>canvas.width-boss.width/2-10)boss.vx*=-1;boss.shootCooldown++;if(boss.shootCooldown>boss.shotCdMax){boss.shootCooldown=0;
          if(boss.tier===1)[-20,20].forEach(ox=>enemyBullets.push({x:boss.x+ox,y:boss.y+35,vx:0,vy:5,color:'#facc15'}));
          else if(boss.tier===2)[-.3,-.1,.1,.3].forEach(ang=>enemyBullets.push({x:boss.x,y:boss.y+35,vx:Math.sin(ang)*5,vy:Math.cos(ang)*5,color:'#f87171'}));
          else if(boss.tier===3)[-.35,0,.35].forEach(ang=>enemyBullets.push({x:boss.x,y:boss.y+40,vx:Math.sin(ang)*6.5,vy:Math.cos(ang)*6.5,color:'#38bdf8'}));
          else if(boss.tier===4)[-.45,-.22,0,.22,.45].forEach(ang=>enemyBullets.push({x:boss.x,y:boss.y+45,vx:Math.sin(ang)*5.2,vy:Math.cos(ang)*5.2,color:'#fbbf24'}));
          else for(let a=0;a<8;a++){const ang=Math.PI*2/8*a+frame*.05;enemyBullets.push({x:boss.x,y:boss.y+20,vx:Math.cos(ang)*4.5,vy:Math.sin(ang)*4.5,color:'#c084fc'});}
        }}
        drawBossEntity(boss);boss.displayHp+=(boss.hp-boss.displayHp)*.15;const barW=canvas.width*.7,barX=(canvas.width-barW)/2+10;ctx.fillStyle='rgba(15,23,42,.8)';ctx.fillRect(barX,58,barW,12);ctx.fillStyle=boss.color;ctx.fillRect(barX,58,barW*Math.max(0,boss.displayHp/boss.maxHp),12);ctx.strokeStyle=boss.subColor;ctx.lineWidth=1.5;ctx.strokeRect(barX,58,barW,12);ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(`${boss.name} (${Math.max(0,boss.hp)} / ${boss.maxHp})`,canvas.width/2+10,52);
        for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.width/2){bullets.splice(j,1);boss.hp--;spawnExplosion(b.x,b.y,'#f59e0b',3);}}
        for(let m=missiles.length-1;m>=0;m--){const ms=missiles[m];if(Math.hypot(ms.x-boss.x,ms.y-boss.y)<boss.width/2){missiles.splice(m,1);boss.hp-=3;playSound('boom');spawnExplosion(ms.x,ms.y,'#ec4899',10);}}
        if(Math.hypot(player.x-boss.x,player.y-boss.y)<boss.width/2+10)applyDamage(50);
        if(boss.hp<=0){playSound('boom');spawnExplosion(boss.x,boss.y,boss.subColor,50);score+=200*boss.tier;nextBossScore=score+450;if(bossTier<5)bossTier++;else BOSS_CONFIGS[5].hp=Math.round(BOSS_CONFIGS[5].hp*1.3);boss=null;}
      }
      for(let i=enemyBullets.length-1;i>=0;i--){const eb=enemyBullets[i];eb.x+=eb.vx;eb.y+=eb.vy;ctx.fillStyle=eb.color||'#fb7185';ctx.beginPath();ctx.arc(eb.x,eb.y,4,0,Math.PI*2);ctx.fill();if(Math.hypot(player.x-eb.x,player.y-eb.y)<player.radius+4){enemyBullets.splice(i,1);applyDamage(20);continue;}if(eb.y>canvas.height+20||eb.x<-20||eb.x>canvas.width+20)enemyBullets.splice(i,1);}
      if(frame%(boss?70:32)===0)enemies.push({x:Math.random()*(canvas.width-70)+45,y:-30,hp:1,speed:3.2+Math.random()*1.5});
      for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.y+=e.speed;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.PI);ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(18,10);ctx.lineTo(-18,10);ctx.closePath();ctx.fill();ctx.restore();
        for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<20){bullets.splice(j,1);e.hp=0;break;}}
        for(let m=missiles.length-1;m>=0;m--){const ms=missiles[m];if(Math.hypot(ms.x-e.x,ms.y-e.y)<22){missiles.splice(m,1);e.hp=0;break;}}
        if(e.hp<=0){playSound('boom');spawnExplosion(e.x,e.y,'#ef4444',12);score+=10;const rand=Math.random();if(rand<.10)items.push({x:e.x,y:e.y,type:'P'});else if(rand<.20)items.push({x:e.x,y:e.y,type:'M'});else if(rand<.30)items.push({x:e.x,y:e.y,type:'E'});enemies.splice(i,1);continue;}
        if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+14){enemies.splice(i,1);applyDamage(35);continue;}if(e.y>canvas.height+30)enemies.splice(i,1);
      }
      for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=2.2;if(it.type==='M')ctx.fillStyle='#ec4899';else if(it.type==='E')ctx.fillStyle='#06b6d4';else ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(it.x,it.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.type,it.x,it.y);
        if(Math.hypot(player.x-it.x,player.y-it.y)<player.radius+12){if(it.type==='P')weaponLevel=Math.min(3,weaponLevel+1);else if(it.type==='M'){hasHomingMissile=true;missileTimer=500;}else{playSound('heal');player.energy=Math.min(player.maxEnergy,player.energy+30);spawnExplosion(player.x,player.y,'#06b6d4',10);}items.splice(i,1);}else if(it.y>canvas.height+20)items.splice(i,1);}
      for(let i=particles.length-1;i>=0;i--){const pt=particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.alpha-=.035;if(pt.alpha<=0)particles.splice(i,1);else{ctx.save();ctx.globalAlpha=pt.alpha;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
      drawLeftEnergyBar();ctx.fillStyle='#f8fafc';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText(`SCORE ${score}`,50,34);
      if(hasHomingMissile){ctx.fillStyle='#ec4899';ctx.font='bold 12px sans-serif';ctx.fillText(`MISSILE (${Math.ceil(missileTimer/60)}s)`,50,52);}
      ctx.fillStyle=isMuted?'#64748b':'#38bdf8';ctx.font='18px sans-serif';ctx.fillText(isMuted?'🔇':'🔊',canvas.width-25,36);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
