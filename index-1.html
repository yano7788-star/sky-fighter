<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber Strike: Neon Warfare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050811;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d",{alpha:false});
function resize(){canvas.width=innerWidth;canvas.height=innerHeight} resize(); addEventListener("resize",resize);

let gameState="START",score=0,weaponLevel=1,hasHomingMissile=false,missileTimer=0,frame=0,bombs=1,bombFlash=0;
let bossTier=1,boss=null,nextBossScore=250,bossWarningTimer=0,isMuted=false;
const stars=Array.from({length:75},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.7+.5,speed:Math.random()*2+.8}));
const bullets=[],missiles=[],enemyBullets=[],enemies=[],particles=[],items=[];

const BOSS_CONFIGS={
1:{name:"STAGE 1: TANK BUSTER",hp:80,color:"#4d7c0f",subColor:"#bef264",w:130,shotCd:40},
2:{name:"STAGE 2: CYBER STEALTH",hp:160,color:"#0284c7",subColor:"#38bdf8",w:140,shotCd:34},
3:{name:"STAGE 3: AEGIS FLAGSHIP",hp:270,color:"#ca8a04",subColor:"#facc15",w:150,shotCd:28},
4:{name:"STAGE 4: HEAVY DESTROYER",hp:420,color:"#b91c1c",subColor:"#f87171",w:155,shotCd:24},
5:{name:"STAGE 5: VOID ARCHANGEL",hp:650,color:"#7e22ce",subColor:"#c084fc",w:165,shotCd:18}
};
const player={x:innerWidth/2,y:innerHeight-140,targetX:innerWidth/2,targetY:innerHeight-140,radius:22,energy:100,maxEnergy:100,displayEnergy:100,invincible:0};

function loadImage(src){
  const img=new Image();
  img.decoding="async";
  img.src=src;
  return img;
}
const startScreenImg=loadImage("./Startscreen.png");
let startLoaded=false; startScreenImg.onload=()=>startLoaded=true;

const playerImg=loadImage("./player.png");
let playerCanvas=null,playerLoaded=false;
playerImg.onload=()=>{playerCanvas=removeFakeBackground(playerImg);playerLoaded=true};

const bombImg=loadImage("./bomb.png");
let bombCanvas=null,bombLoaded=false;
bombImg.onload=()=>{bombCanvas=removeFakeBackground(bombImg);bombLoaded=true};

const bossImages={},bossCanvases={},bossLoaded={};
for(let i=1;i<=5;i++){
  bossImages[i]=loadImage(`./boss${i}.png`);
  bossLoaded[i]=false;
  bossImages[i].onload=()=>{bossCanvases[i]=removeFakeBackground(bossImages[i]);bossLoaded[i]=true};
}

/* 이미지 가장자리의 단색/검정 배경을 투명화합니다.
   중앙의 실제 기체 색상은 건드리지 않고, 외곽에서 연결되는 배경만 제거합니다. */
function removeFakeBackground(img){
  const w=img.naturalWidth,h=img.naturalHeight;
  if(!w||!h)return null;
  const off=document.createElement("canvas");off.width=w;off.height=h;
  const c=off.getContext("2d",{willReadFrequently:true});c.drawImage(img,0,0);
  const d=c.getImageData(0,0,w,h),a=d.data;
  const samples=[0,w-1,(h-1)*w,(h-1)*w+w-1].map(p=>[a[p*4],a[p*4+1],a[p*4+2]]);
  const bg=samples.reduce((s,v)=>[s[0]+v[0],s[1]+v[1],s[2]+v[2]],[0,0,0]).map(v=>v/4);
  const vis=new Uint8Array(w*h),q=[];
  function similar(i){
    const r=a[i*4],g=a[i*4+1],b=a[i*4+2],al=a[i*4+3];
    if(al===0)return true;
    const dist=Math.hypot(r-bg[0],g-bg[1],b-bg[2]);
    const dark=r<28&&g<28&&b<35;
    return dist<42||dark;
  }
  for(let x=0;x<w;x++){let p=x;if(!vis[p]){vis[p]=1;q.push(p)}p=(h-1)*w+x;if(!vis[p]){vis[p]=1;q.push(p)}}
  for(let y=1;y<h-1;y++){let p=y*w;if(!vis[p]){vis[p]=1;q.push(p)}p=y*w+w-1;if(!vis[p]){vis[p]=1;q.push(p)}}
  for(let head=0;head<q.length;head++){
    const p=q[head],x=p%w,y=(p/w)|0;
    if(!similar(p))continue;
    a[p*4+3]=0;
    if(x>0&&!vis[p-1]){vis[p-1]=1;q.push(p-1)}
    if(x<w-1&&!vis[p+1]){vis[p+1]=1;q.push(p+1)}
    if(y>0&&!vis[p-w]){vis[p-w]=1;q.push(p-w)}
    if(y<h-1&&!vis[p+w]){vis[p+w]=1;q.push(p+w)}
  }
  c.putImageData(d,0,0);return off;
}

/* 사운드 */
let audioCtx=null,bgmGain=null,bgmStep=0,nextNoteTime=0,bgmRunning=false;
const N={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,REST:0};
const normal=[["A3","A4"],["A3","C5"],["A3","E5"],["A3","A4"],["F3","F4"],["F3","A4"],["F3","C5"],["F3","F5"],["G3","G4"],["G3","B4"],["G3","D5"],["G3","G5"],["E3","E4"],["E3","G4"],["E3","B4"],["E3","E5"]];
const bossTune=[["D3","D5"],["D3","REST"],["D3","F5"],["D3","D5"],["C3","C5"],["C3","REST"],["C3","E5"],["C3","C5"],["B3","B4"],["B3","REST"],["B3","D5"],["B3","B4"],["C3","C5"],["D3","D5"],["E3","E5"],["F3","F5"]];
function initAudio(){
 if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();bgmGain=audioCtx.createGain();bgmGain.gain.value=.07;bgmGain.connect(audioCtx.destination)}
 if(audioCtx.state==="suspended")audioCtx.resume();
 if(!bgmRunning){bgmRunning=true;nextNoteTime=audioCtx.currentTime+.05}
}
function tone(freq,type,dur,t,vol){
 if(!audioCtx||!freq||isMuted)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(bgmGain);o.start(t);o.stop(t+dur);
}
function updateBgm(){
 if(!bgmRunning||!audioCtx||gameState!=="PLAYING")return;
 const arr=boss?bossTune:normal,tempo=boss?155:130,step=60/tempo/4;
 while(nextNoteTime<audioCtx.currentTime+.15){
   const n=arr[bgmStep%arr.length];tone(N[n[0]],"triangle",step*.9,nextNoteTime,.18);tone(N[n[1]],"square",step*.55,nextNoteTime,.06);
   nextNoteTime+=step;bgmStep++;
 }
}
function sound(type){
 if(!audioCtx||isMuted||gameState!=="PLAYING")return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);
 const p={laser:[820,200,.07,.08,"square"],missile:[280,600,.1,.1,"sawtooth"],boom:[140,30,.4,.35,"sawtooth"],item:[440,1100,.16,.16,"sine"],heal:[300,800,.25,.18,"sine"]}[type];
 if(!p)return;o.type=p[4];o.frequency.setValueAtTime(p[0],t);o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]);g.gain.setValueAtTime(p[3],t);g.gain.exponentialRampToValueAtTime(.01,t+p[2]);o.start(t);o.stop(t+p[2]);
}

/* 조작 */
function bombHit(x,y){const bx=canvas.width-55,by=canvas.height-65;return Math.hypot(x-bx,y-by)<45}
function soundHit(x,y){return Math.hypot(x-(canvas.width-45),y-30)<25}
function fireBomb(){
 if(bombs<=0||gameState!=="PLAYING")return;
 bombs--;bombFlash=1;sound("boom");enemyBullets.length=0;enemies.forEach(e=>e.hp=0);
 if(boss){boss.hp-=40;spawnExplosion(boss.x,boss.y,"#ef4444",30)}
}
function pointer(x,y,tap){
 if(gameState==="START"){if(tap){initAudio();restartGame()}return}
 if(gameState==="GAMEOVER"||gameState==="GAMECLEAR"){if(tap)restartGame();return}
 if(tap&&soundHit(x,y)){isMuted=!isMuted;if(bgmGain)bgmGain.gain.setValueAtTime(isMuted?0:.07,audioCtx.currentTime);return}
 if(tap&&bombHit(x,y)){fireBomb();return}
 player.targetX=x;player.targetY=y-50;
}
canvas.addEventListener("touchstart",e=>{e.preventDefault();const t=e.touches[0];pointer(t.clientX,t.clientY,true)},{passive:false});
canvas.addEventListener("touchmove",e=>{e.preventDefault();if(gameState==="PLAYING"){const t=e.touches[0];pointer(t.clientX,t.clientY,false)}},{passive:false});
canvas.addEventListener("mousedown",e=>pointer(e.clientX,e.clientY,true));
canvas.addEventListener("mousemove",e=>{if(gameState==="PLAYING"&&e.buttons)pointer(e.clientX,e.clientY,false)});

function spawnExplosion(x,y,color,count=12){
 for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*3+1.5,alpha:1,color})}
}
function damage(n){
 if(player.invincible||gameState!=="PLAYING")return;
 player.energy=Math.max(0,player.energy-n);player.invincible=40;sound("boom");spawnExplosion(player.x,player.y,"#ef4444",16);
 if(!player.energy)gameState="GAMEOVER";
}
function spawnBoss(t){
 const c=BOSS_CONFIGS[t];bossWarningTimer=110;
 boss={tier:t,name:c.name,x:canvas.width/2,y:-130,targetY:135,width:c.w,height:100,vx:2.3+t*.25,hp:c.hp,maxHp:c.hp,displayHp:c.hp,shootCooldown:0,color:c.color,subColor:c.subColor,shotCdMax:c.shotCd}
}
function restartGame(){
 score=0;weaponLevel=1;hasHomingMissile=false;missileTimer=0;bossTier=1;boss=null;nextBossScore=250;bossWarningTimer=0;bombs=1;bombFlash=0;
 player.energy=100;player.displayEnergy=100;player.invincible=0;player.x=canvas.width/2;player.y=canvas.height-140;player.targetX=player.x;player.targetY=player.y;
 bullets.length=0;missiles.length=0;enemyBullets.length=0;enemies.length=0;particles.length=0;items.length=0;gameState="PLAYING";
}

/* 그리기 */
function drawStart(){
 ctx.fillStyle="#050811";ctx.fillRect(0,0,canvas.width,canvas.height);
 if(startLoaded){
   const ir=startScreenImg.naturalWidth/startScreenImg.naturalHeight,cr=canvas.width/canvas.height;
   let dw=canvas.width,dh=dw/ir,dx=0,dy=(canvas.height-dh)/2;
   if(cr<=ir){dh=canvas.height;dw=dh*ir;dx=(canvas.width-dw)/2;dy=0}
   ctx.drawImage(startScreenImg,dx,dy,dw,dh);
 }
 const w=Math.min(canvas.width*.72,320),h=58,x=(canvas.width-w)/2,y=canvas.height*.84,p=.5+.5*Math.sin(frame*.1);
 ctx.save();ctx.strokeStyle=`rgba(56,189,248,${.45+p*.5})`;ctx.lineWidth=3;ctx.shadowColor="#06b6d4";ctx.shadowBlur=14*p;ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.stroke();ctx.restore();
 ctx.fillStyle="#fff";ctx.font="900 20px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("TAP TO START",canvas.width/2,y+h/2);
}
function drawPlayer(){
 ctx.save();ctx.translate(player.x,player.y);
 if(player.invincible&&Math.floor(frame/4)%2===0)ctx.globalAlpha=.4;
 if(playerLoaded&&playerCanvas){
   const w=100,h=w*(playerCanvas.height/playerCanvas.width);
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(playerCanvas,-w/2,-h/2,w,h);
 }else{
   ctx.fillStyle="#38bdf8";ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(19,18);ctx.lineTo(0,11);ctx.lineTo(-19,18);ctx.closePath();ctx.fill();
 }
 ctx.restore();
}
function drawBoss(b){
 ctx.save();ctx.translate(b.x,b.y);
 if(bossLoaded[b.tier]&&bossCanvases[b.tier]){
   const img=bossCanvases[b.tier],scale=Math.min(b.width/img.width,b.height/img.height),w=img.width*scale,h=img.height*scale;
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
   ctx.drawImage(img,-w/2,-h/2,w,h);
 }else{
   ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(0,0,b.width/2,b.height/2,0,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle=b.subColor;ctx.lineWidth=3;ctx.stroke();
 }
 ctx.restore();
}
function drawHUD(){
 const bx=canvas.width-55,by=canvas.height-65,br=35;
 /* 에너지 */
 const barX=16,barY=80,bw=14,bh=150;player.displayEnergy+=(player.energy-player.displayEnergy)*.15;
 const ratio=Math.max(0,Math.min(1,player.displayEnergy/player.maxEnergy)),fh=bh*ratio;
 ctx.save();ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillStyle="#94a3b8";ctx.font="bold 11px sans-serif";ctx.fillText("ENG",barX+bw/2,barY-14);
 ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.fillText(Math.round(player.energy)+"%",barX+bw/2,barY-2);
 ctx.fillStyle="rgba(15,23,42,.8)";ctx.beginPath();ctx.roundRect(barX,barY,bw,bh,7);ctx.fill();
 const ec=player.energy<=25?(frame%8<4?"#ef4444":"#fee2e2"):player.energy<=55?"#f59e0b":"#10b981";
 if(fh>4){ctx.fillStyle=ec;ctx.beginPath();ctx.roundRect(barX+2,barY+bh-fh+2,bw-4,fh-4,5);ctx.fill()}
 ctx.strokeStyle=ec;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(barX,barY,bw,bh,7);ctx.stroke();ctx.restore();

 /* 폭탄 버튼 */
 ctx.save();ctx.globalAlpha=bombs>0?1:.42;
 if(bombLoaded&&bombCanvas){
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
   ctx.drawImage(bombCanvas,bx-br,by-br,br*2,br*2);
 }else{
   ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=bombs?"rgba(6,182,212,.8)":"rgba(100,116,139,.5)";ctx.fill();ctx.strokeStyle="#38bdf8";ctx.lineWidth=2;ctx.stroke();
 }
 ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 20px sans-serif";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.9)";ctx.strokeText("×"+bombs,bx,by);ctx.fillStyle="#fff";ctx.fillText("×"+bombs,bx,by);ctx.restore();

 ctx.fillStyle="#f8fafc";ctx.font="bold 16px sans-serif";ctx.textAlign="left";ctx.textBaseline="alphabetic";ctx.fillText("SCORE "+score,50,34);
 ctx.fillStyle="#38bdf8";ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.fillText("STAGE "+bossTier,canvas.width/2,34);
 if(hasHomingMissile){ctx.fillStyle="#ec4899";ctx.font="bold 12px sans-serif";ctx.textAlign="left";ctx.fillText("MISSILE ("+Math.ceil(missileTimer/60)+"s)",50,52)}
 ctx.fillStyle=isMuted?"#64748b":"#38bdf8";ctx.font="18px sans-serif";ctx.textAlign="right";ctx.fillText(isMuted?"🔇":"🔊",canvas.width-25,36);

 if(bombFlash>0){ctx.fillStyle=`rgba(255,255,255,${bombFlash})`;ctx.fillRect(0,0,canvas.width,canvas.height);bombFlash-=.04}
}

function drawEnd(title,color,sub){
 ctx.fillStyle="rgba(5,8,17,.9)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign="center";
 ctx.fillStyle=color;ctx.font="900 34px sans-serif";ctx.fillText(title,canvas.width/2,canvas.height/2-40);
 ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.fillText("최종 점수: "+score,canvas.width/2,canvas.height/2+10);
 if(sub){ctx.fillStyle="#facc15";ctx.font="bold 18px sans-serif";ctx.fillText(sub,canvas.width/2,canvas.height/2+45)}
 ctx.fillStyle="#38bdf8";ctx.font="16px sans-serif";ctx.fillText("화면을 탭하여 다시 출격",canvas.width/2,canvas.height/2+100);
}

function loop(){
 frame++;
 if(gameState==="START"){drawStart();requestAnimationFrame(loop);return}
 if(gameState==="GAMEOVER"){drawEnd("MISSION OVER","#f87171","최종 도달: STAGE "+bossTier);requestAnimationFrame(loop);return}
 if(gameState==="GAMECLEAR"){drawEnd("MISSION CLEAR!","#10b981","지구의 평화를 지켰습니다.");requestAnimationFrame(loop);return}

 if(player.invincible>0)player.invincible--;
 ctx.fillStyle="#050811";ctx.fillRect(0,0,canvas.width,canvas.height);updateBgm();
 ctx.fillStyle="#94a3b8";for(const s of stars){s.y+=s.speed;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}

 player.x+=(player.targetX-player.x)*.25;player.y+=(player.targetY-player.y)*.25;
 player.x=Math.max(38,Math.min(canvas.width-38,player.x));player.y=Math.max(45,Math.min(canvas.height-45,player.y));drawPlayer();

 if(frame%8===0){
   sound("laser");
   if(weaponLevel===1){bullets.push({x:player.x-18,y:player.y-25,vx:0,vy:-13},{x:player.x+18,y:player.y-25,vx:0,vy:-13})}
   else if(weaponLevel===2){bullets.push({x:player.x-22,y:player.y-20,vx:-1,vy:-13},{x:player.x,y:player.y-36,vx:0,vy:-13},{x:player.x+22,y:player.y-20,vx:1,vy:-13})}
   else bullets.push({x:player.x-26,y:player.y-18,vx:-2.5,vy:-13},{x:player.x-12,y:player.y-30,vx:0,vy:-13},{x:player.x+12,y:player.y-30,vx:0,vy:-13},{x:player.x+26,y:player.y-18,vx:2.5,vy:-13});
 }
 if(hasHomingMissile){
   missileTimer--;if(missileTimer<=0)hasHomingMissile=false;
   if(frame%18===0){sound("missile");missiles.push({x:player.x-26,y:player.y,vx:-3,vy:-5,speed:7.5},{x:player.x+26,y:player.y,vx:3,vy:-5,speed:7.5})}
 }
 ctx.fillStyle="#fde047";for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,Math.PI*2);ctx.fill();if(b.y<-15||b.x<0||b.x>canvas.width)bullets.splice(i,1)}
 for(let i=missiles.length-1;i>=0;i--){
   const m=missiles[i];let target=boss||enemies[0];
   if(!boss&&enemies.length){let md=1e9;for(const e of enemies){const d=Math.hypot(e.x-m.x,e.y-m.y);if(d<md){md=d;target=e}}}
   if(target){let desired=Math.atan2(target.y-m.y,target.x-m.x),cur=Math.atan2(m.vy,m.vx),diff=desired-cur;while(diff<-Math.PI)diff+=Math.PI*2;while(diff>Math.PI)diff-=Math.PI*2;const a=cur+diff*.14;m.vx=Math.cos(a)*m.speed;m.vy=Math.sin(a)*m.speed}
   m.x+=m.vx;m.y+=m.vy;if(frame%2===0)particles.push({x:m.x,y:m.y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,r:2,alpha:.8,color:"#ec4899"});
   ctx.save();ctx.translate(m.x,m.y);ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);ctx.fillStyle="#f43f5e";ctx.fillRect(-2.5,-7,5,14);ctx.fillStyle="#fbcfe8";ctx.fillRect(-1.5,-9,3,4);ctx.restore();
   if(m.y<-30||m.y>canvas.height+30||m.x<-30||m.x>canvas.width+30)missiles.splice(i,1)
 }

 if(!boss&&score>=nextBossScore)spawnBoss(bossTier);
 if(bossWarningTimer>0){bossWarningTimer--;if(Math.floor(frame/10)%2===0){ctx.fillStyle="#ef4444";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.fillText("⚠ WARNING: "+BOSS_CONFIGS[bossTier].name+" ⚠",canvas.width/2,canvas.height/2-80)}}

 if(boss){
   if(boss.y<boss.targetY)boss.y+=1.5;
   else{
     boss.x+=boss.vx;if(boss.x<boss.width/2+10||boss.x>canvas.width-boss.width/2-10)boss.vx*=-1;
     boss.shootCooldown++;
     if(boss.shootCooldown>boss.shotCdMax){
       boss.shootCooldown=0;
       const t=boss.tier;
       if(t===1)[-20,20].forEach(x=>enemyBullets.push({x:boss.x+x,y:boss.y+35,vx:0,vy:5,color:"#facc15"}));
       else if(t===2)[-.35,0,.35].forEach(a=>enemyBullets.push({x:boss.x,y:boss.y+40,vx:Math.sin(a)*6.5,vy:Math.cos(a)*6.5,color:"#38bdf8"}));
       else if(t===3)[-.45,-.22,0,.22,.45].forEach(a=>enemyBullets.push({x:boss.x,y:boss.y+45,vx:Math.sin(a)*5.2,vy:Math.cos(a)*5.2,color:"#fbbf24"}));
       else if(t===4)[-.3,-.1,.1,.3].forEach(a=>enemyBullets.push({x:boss.x,y:boss.y+35,vx:Math.sin(a)*5,vy:Math.cos(a)*5,color:"#f87171"}));
       else for(let a=0;a<8;a++){const ang=Math.PI*2/8*a+frame*.05;enemyBullets.push({x:boss.x,y:boss.y+20,vx:Math.cos(ang)*4.5,vy:Math.sin(ang)*4.5,color:"#c084fc"})}
     }
   }
   drawBoss(b);
   boss.displayHp+=(boss.hp-boss.displayHp)*.15;const barW=canvas.width*.7,barX=(canvas.width-barW)/2+10;
   ctx.fillStyle="rgba(15,23,42,.8)";ctx.fillRect(barX,58,barW,12);ctx.fillStyle=boss.color;ctx.fillRect(barX,58,barW*Math.max(0,boss.displayHp/boss.maxHp),12);ctx.strokeStyle=boss.subColor;ctx.lineWidth=1.5;ctx.strokeRect(barX,58,barW,12);
   ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(boss.name+" ("+Math.max(0,boss.hp)+" / "+boss.maxHp+")",canvas.width/2+10,52);

   for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.width/2){bullets.splice(j,1);boss.hp--;spawnExplosion(b.x,b.y,"#f59e0b",3)}}
   for(let j=missiles.length-1;j>=0;j--){const m=missiles[j];if(Math.hypot(m.x-boss.x,m.y-boss.y)<boss.width/2){missiles.splice(j,1);boss.hp-=3;sound("boom");spawnExplosion(m.x,m.y,"#ec4899",10)}}
   if(Math.hypot(player.x-boss.x,player.y-boss.y)<boss.width/2+10)damage(50);
   if(boss.hp<=0){sound("boom");spawnExplosion(boss.x,boss.y,boss.subColor,50);score+=200*boss.tier;if(bossTier===5){gameState="GAMECLEAR";boss=null}else{nextBossScore=score+450;bossTier++;boss=null}}
 }

 for(let i=enemyBullets.length-1;i>=0;i--){const e=enemyBullets[i];e.x+=e.vx;e.y+=e.vy;ctx.fillStyle=e.color||"#fb7185";ctx.beginPath();ctx.arc(e.x,e.y,4,0,Math.PI*2);ctx.fill();if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+4){enemyBullets.splice(i,1);damage(20);continue}if(e.y>canvas.height+20||e.x<-20||e.x>canvas.width+20)enemyBullets.splice(i,1)}

 if(frame%(boss?70:32)===0)enemies.push({x:Math.random()*(canvas.width-70)+35,y:-30,hp:1,speed:3.2+Math.random()*1.5});
 for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];e.y+=e.speed;
   ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.PI);ctx.fillStyle="#f43f5e";ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(18,10);ctx.lineTo(-18,10);ctx.closePath();ctx.fill();ctx.restore();
   for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<20){bullets.splice(j,1);e.hp=0;break}}
   for(let j=missiles.length-1;j>=0;j--){const m=missiles[j];if(Math.hypot(m.x-e.x,m.y-e.y)<22){missiles.splice(j,1);e.hp=0;break}}
   if(e.hp<=0){
     sound("boom");spawnExplosion(e.x,e.y,"#ef4444",12);score+=10;const r=Math.random();
     if(r<.05)items.push({x:e.x,y:e.y,type:"P"});else if(r<.09)items.push({x:e.x,y:e.y,type:"M"});else if(r<.13)items.push({x:e.x,y:e.y,type:"E"});else if(r<.15)items.push({x:e.x,y:e.y,type:"B"});
     enemies.splice(i,1);continue
   }
   if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+14){enemies.splice(i,1);damage(35);continue}
   if(e.y>canvas.height+30)enemies.splice(i,1)
 }

 for(let i=items.length-1;i>=0;i--){
   const it=items[i];it.y+=2.2;ctx.fillStyle=it.type==="M"?"#ec4899":it.type==="E"?"#06b6d4":it.type==="B"?"#ef4444":"#10b981";ctx.beginPath();ctx.arc(it.x,it.y,12,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(it.type,it.x,it.y);
   if(Math.hypot(player.x-it.x,player.y-it.y)<player.radius+12){
     if(it.type==="P")weaponLevel=Math.min(3,weaponLevel+1);
     else if(it.type==="M"){hasHomingMissile=true;missileTimer=500}
     else if(it.type==="E"){sound("heal");player.energy=Math.min(player.maxEnergy,player.energy+30);spawnExplosion(player.x,player.y,"#06b6d4",10)}
     else{sound("item");bombs=Math.min(2,bombs+1);spawnExplosion(player.x,player.y,"#ef4444",10)}
     items.splice(i,1)
   }else if(it.y>canvas.height+20)items.splice(i,1)
 }

 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=.035;if(p.alpha<=0)particles.splice(i,1);else{ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
 drawHUD();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
