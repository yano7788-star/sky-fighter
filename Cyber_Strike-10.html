            spawnExplosion(boss.x + (Math.random() - 0.5) * boss.width * 0.9, boss.y + (Math.random() - 0.5) * boss.height * 0.9,
                           Math.random() < 0.5 ? boss.subColor : '#f59e0b', 10);
          }
          if (boss.deathTimer % 16 === 1) playSound('boom');
        } else if (boss.y < boss.targetY) {
          boss.y += 1.5;
        } else {
          boss.x += boss.vx; 
          if (boss.x < boss.width / 2 + 10 || boss.x > canvas.width - boss.width / 2 - 10) boss.vx *= -1;
          
          boss.shootCooldown++;
          if (boss.shootCooldown > boss.shotCdMax) {
            boss.shootCooldown = 0;
            boss.attackMode = boss.attackMode === 1 ? 2 : 1; 
            
            const aimAngle = Math.atan2(player.y - boss.y, player.x - boss.x) - Math.PI / 2;

            if (!boss.phase2) {
              if (boss.tier === 1) {
                if (boss.attackMode === 1) [-20, 20].forEach(ox => enemyBullets.push({ x: boss.x+ox, y: boss.y+35, vx: 0, vy: 3.4, color: '#facc15', r: 4.5 }));
                else [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*2.0, vy: Math.cos(ang)*2.0, color: '#fb923c', r: 5.5 }));
              }
              else if (boss.tier === 2) {
                if (boss.attackMode === 1) [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*4.2, vy: Math.cos(ang)*4.2, color: '#38bdf8', r: 4.5 }));
                else [-0.5, -0.25, 0, 0.25, 0.5].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*2.1, vy: Math.cos(ang)*2.1, color: '#06b6d4', r: 5.5 }));
              }
              else if (boss.tier === 3) {
                if (boss.attackMode === 1) [-0.4, -0.2, 0, 0.2, 0.4].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*3.6, vy: Math.cos(ang)*3.6, color: '#fde047', r: 4.5 }));
                else [-0.6, -0.3, 0, 0.3, 0.6].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*1.8, vy: Math.cos(ang)*1.8, color: '#fef08a', r: 6.5 }));
              }
              else if (boss.tier === 4) {
                if (boss.attackMode === 1) [-0.3, -0.1, 0.1, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*3.8, vy: Math.cos(ang)*3.8, color: '#f87171', r: 4.5 }));
                else for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a; enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.cos(ang)*2.0, vy: Math.sin(ang)*2.0, color: '#ef4444', r: 5.5 }); }
              }
              else if (boss.tier === 5) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a + frame*0.04; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*3.8, vy: Math.sin(ang)*3.8, color: '#c084fc', r: 4.5 }); }
                } else {
                  for(let a=0; a<12; a++) { const ang = (Math.PI*2/12)*a - frame*0.02; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*2.0, vy: Math.sin(ang)*2.0, color: '#f472b6', r: 6.5 }); }
                }
              }
            } else {
              if (boss.tier === 1) {
                if (boss.attackMode === 1) {
                  [-32, -12, 12, 32].forEach(ox => enemyBullets.push({ x: boss.x + ox, y: boss.y + 35, vx: 0, vy: 4.2, color: '#facc15', r: 4.8 }));
                } else {
                  [-0.22, 0, 0.22].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 35, vx: Math.sin(ang)*3.2, vy: Math.cos(ang)*3.2, color: '#ea580c', r: 6.5 });
                  });
                }
              }
              else if (boss.tier === 2) {
                if (boss.attackMode === 1) {
                  [-0.5, -0.33, -0.16, 0, 0.16, 0.33, 0.5].forEach(ang => {
                    enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.sin(ang)*4.8, vy: Math.cos(ang)*4.8, color: '#38bdf8', r: 4.5 });
                  });
                } else {
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI * 2 / 8) * a + (frame * 0.08);
                    enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.cos(ang)*2.4, vy: Math.sin(ang)*2.4, color: '#06b6d4', r: 5.5 });
                  }
                }
              }
              else if (boss.tier === 3) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI*2/8)*a + 0.39;
                    enemyBullets.push({ x: boss.x, y: boss.y + 45, vx: Math.cos(ang)*3.4, vy: Math.sin(ang)*3.4, color: '#facc15', r: 5.0 });
                  }
                } else {
                  [-0.35, -0.15, 0.15, 0.35].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 45, vx: Math.sin(ang)*2.2, vy: Math.cos(ang)*2.2, color: '#fef08a', r: 7.0 });
                  });
                }
              }
              else if (boss.tier === 4) {
                if (boss.attackMode === 1) {
                  [-40, -24, -8, 8, 24, 40].forEach(ox => {
                    enemyBullets.push({ x: boss.x + ox, y: boss.y + 35, vx: (ox/40)*1.2, vy: 4.0, color: '#f87171', r: 4.8 });
                  });
                } else {
                  for(let a=0; a<10; a++) {
                    const ang = (Math.PI * 2 / 10) * a;
                    enemyBullets.push({ x: boss.x, y: boss.y + 35, vx: Math.cos(ang)*2.2, vy: Math.sin(ang)*2.2, color: '#ef4444', r: 6.0 });
                  }
                }
              }
              else if (boss.tier === 5) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<12; a++) {
                    const ang = (Math.PI*2/12)*a + frame*0.06;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang)*4.2, vy: Math.sin(ang)*4.2, color: '#c084fc', r: 4.8 });
                  }
                } else {
                  [-0.18, 0, 0.18].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.sin(ang)*5.2, vy: Math.cos(ang)*5.2, color: '#f472b6', r: 6.0 });
                  });
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI*2/8)*a - frame*0.03;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang)*1.8, vy: Math.sin(ang)*1.8, color: '#e879f9', r: 7.0 });
                  }
                }
              }
            }
          }
        }

        // 고대비 테두리가 적용된 보스 렌더링 호출
        drawBossEntity(boss);
        if (boss.hitFlash > 0) { boss.hitFlash--; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; drawBossEntity(boss); ctx.restore(); }   // 피격 시 밝게 번쩍

        if (boss.phase2Alert > 0) {
          boss.phase2Alert--;
          ctx.save();
          ctx.fillStyle = (frame % 8 < 4) ? '#ef4444' : '#facc15';
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 6;
          ctx.fillText('⚡ PHASE 2: OVERDRIVE ⚡', canvas.width / 2, canvas.height * 0.38);
          ctx.restore();
        }

        boss.displayHp += (boss.hp - boss.displayHp) * 0.15; 
        const barW = canvas.width * 0.7, barX = (canvas.width - barW) / 2 + 10;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(barX, 58, barW, 12);
        ctx.fillStyle = boss.phase2 ? ((frame % 6 < 3) ? '#ef4444' : '#f59e0b') : boss.color; 
        ctx.fillRect(barX, 58, barW * Math.max(0, boss.displayHp / boss.maxHp), 12);
        ctx.strokeStyle = boss.phase2 ? '#f87171' : boss.subColor; ctx.lineWidth = 1.5; ctx.strokeRect(barX, 58, barW, 12);
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; 
        const phaseLabel = boss.phase2 ? ' [PHASE 2]' : '';
        ctx.fillText(`${boss.name}${phaseLabel} (${Math.max(0, boss.hp)} / ${boss.maxHp})`, canvas.width / 2 + 10, 52);

        if (!boss.dying) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.width / 2) { bullets.splice(j, 1); boss.hp--; lifestealHit(b.x, b.y, 1); spawnExplosion(b.x, b.y, '#f59e0b', 3); boss.hitFlash = 3; hitSfx('hitb'); addRing(b.x, b.y, '#fde68a', 16, 8); }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (Math.hypot(ms.x - boss.x, ms.y - boss.y) < boss.width / 2) { missiles.splice(m, 1); boss.hp -= 3; lifestealHit(ms.x, ms.y, 3); playSound('boom'); boss.hitFlash = 5; addShake(2.5); addRing(ms.x, ms.y, '#f9a8d4', 30, 12); spawnExplosion(ms.x, ms.y, '#ec4899', 10); }
        }
        if (Math.hypot(player.x - boss.x, player.y - boss.y) < boss.width / 2 + 10) applyDamage(50);
        }
        
        // 체력이 0이 되어도 바로 사라지지 않고 '폭발 연출 → 클리어 → 다음 스테이지' 순서로 이어짐
        if (!boss.dying && boss.hp <= 0) {
          boss.dying = true; boss.deathTimer = 0; boss.hp = 0; boss.phase2Alert = 0;
          stagePhase = 'BOSS_DYING'; phaseTimer = PHASE_FRAMES.BOSS_DYING;
          clearBonus = 200 * boss.tier; score += clearBonus;
          if (boss.tier === 3 && lives >= 2) grantUltimate();   // 3번째 보스를 목숨 2개 유지한 채 처치 → 궁극의 필살기 획득
          playSound('boom'); spawnExplosion(boss.x, boss.y, boss.subColor, 30); addShake(7); hitStop = Math.max(hitStop, 6);
          enemyBullets.length = 0;                                                      // 남은 탄막 제거
          clearEnemiesForEvent();                                                       // 잔여 적기 정리 (화면 밖 적은 조용히 제거)
          missiles.forEach(ms => spawnExplosion(ms.x, ms.y, '#ec4899', 6)); missiles.length = 0;
        }
      }

      updateMidBoss();   // 중간 보스 (이동·레이저·피격·처치)

      // 적 탄환 업데이트
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (i >= enemyBullets.length) continue;
        const eb = enemyBullets[i]; 
        if (!eb) continue;
        eb.x += eb.vx; eb.y += eb.vy; 
        const r = eb.r || 4.5;
        
        drawHighVisibilityEnemyBullet(eb);
        
        // 동료2 방어막: 방어막 반경에 닿은 탄환은 피해 없이 소멸
        if (companions.dog.active && Math.hypot(player.x - eb.x, player.y - eb.y) < SHIELD_R + r) {
          shieldFlash = 8; spawnExplosion(eb.x, eb.y, '#67e8f9', 3);
          if (frame - lastShieldSfx > 10) { lastShieldSfx = frame; playSound('shield'); }
          enemyBullets.splice(i, 1);
          continue;
        }
        if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + r) { 
          enemyBullets.splice(i, 1); 
          applyDamage(20); 
          if (enemyBullets.length === 0) break;
          continue; 
        }
        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20 || eb.y < -20) enemyBullets.splice(i, 1);
      }

      // 일반 적 스폰
      const spawnOk = stagePhase === 'FIGHT' || stagePhase === 'BOSS' || (stagePhase === 'INTRO' && phaseTimer < PHASE_FRAMES.INTRO - 50);
      if (spawnOk && frame % (boss || midBoss ? 70 : 32) === 0) enemies.push({ x: Math.random() * (canvas.width - 70) + 45, y: -30, hp: 1, speed: 3.2 + Math.random() * 1.5 });
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (i >= enemies.length) continue;
        const e = enemies[i]; 
        if (!e) continue;
        e.y += e.speed;
        drawMob(e);

        if (e.hp > 0 && Math.random() < 0.008) {   // 이미 격추된 적은 발사하지 않음
          enemyBullets.push({ x: e.x, y: e.y + 17, vx: 0, vy: 2.2, color: '#f43f5e', r: 4 });   // 전투기 기수(기관포)에서 발사되는 일반 총알
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (enemyInView(e) && Math.hypot(b.x - e.x, b.y - e.y) < 22) { bullets.splice(j, 1); if (e.hp > 0) lifestealHit(e.x, e.y, MOB_HIT_VALUE); e.hp = 0; break; }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (enemyInView(e) && Math.hypot(ms.x - e.x, ms.y - e.y) < 24) { missiles.splice(m, 1); if (e.hp > 0) lifestealHit(e.x, e.y, MOB_HIT_VALUE); e.hp = 0; break; }
        }
        if (companions.dog.active && enemyInView(e) && Math.hypot(player.x - e.x, player.y - e.y) < SHIELD_R + 20) e.hp = 0;   // 방어막에 부딪힌 적 전투기는 파괴
        if (e.hp <= 0) {
          playSound('boom'); spawnExplosion(e.x, e.y, '#ef4444', 12); addRing(e.x, e.y, '#fca5a5', 30, 14); score += 10;
          
          const drop = maybeDropCompanion(e.x, e.y) ? null : rollItemDrop(Math.random());   // 동료 아이템이 나왔으면 일반 아이템은 생략
          if (drop) items.push({ x: e.x, y: e.y, type: drop });

          enemies.splice(i, 1); continue;
        }
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + 14) { 
          enemies.splice(i, 1); 
          applyDamage(35); 
          continue; 
        }
        if (e.y > canvas.height + 30) enemies.splice(i, 1);
      }

      // 아이템 업데이트
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.y += it.type === 'H' ? 1.5 : 2.2;
        const comp = companionOfItem(it.type);
        if (comp) drawCompanionItem(it, comp);
        else if (it.type === 'H') drawHeartItem(it);
        else {
          ctx.fillStyle = it.type === 'M' ? '#ec4899' : it.type === 'E' ? '#06b6d4' : it.type === 'B' ? '#ef4444' : '#10b981';
          ctx.beginPath(); ctx.arc(it.x, it.y, 12, 0, Math.PI * 2); ctx.fill();
          ctx.save(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.type, it.x, it.y); ctx.restore();
        }

        if (Math.hypot(player.x - it.x, player.y - it.y) < player.radius + (comp ? 17 : it.type === 'H' ? 20 : 12)) {
          if (comp) collectCompanion(comp);
          else if (it.type === 'H') collectHeart();
          else if (it.type === 'P') weaponLevel = Math.min(3, weaponLevel + 1);
          else if (it.type === 'M') { hasHomingMissile = true; missileTimer = 500; }
          else if (it.type === 'E') { playSound('heal'); player.energy = Math.min(player.maxEnergy, player.energy + 30); spawnExplosion(player.x, player.y, '#06b6d4', 10); }
          else if (it.type === 'B') { 
            playSound('item'); 
            bombs = Math.min(2, bombs + 1); 
            spawnExplosion(player.x, player.y, '#ef4444', 10); 
          }
          items.splice(i, 1);
        } else if (it.y > canvas.height + 20) items.splice(i, 1);
      }

      // 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy;
        if (pt.drag && pt.drag !== 1) { pt.vx *= pt.drag; pt.vy *= pt.drag; }
        pt.alpha -= (pt.fade || 0.035);
        // 화면 밖으로 나간 파티클은 즉시 제거 (먼 좌표에 글로우를 그리면 매우 느려짐)
        if (pt.x < -40 || pt.x > canvas.width + 40 || pt.y < -40 || pt.y > canvas.height + 40) { particles.splice(i, 1); continue; }
        if (pt.alpha <= 0) particles.splice(i, 1);
        else if (pt.glow) {
          const g = glowSprite(pt.color), d = pt.r * 5;
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, pt.alpha);
          ctx.drawImage(g, pt.x - d / 2, pt.y - d / 2, d, d); ctx.restore();
        }
        else { ctx.save(); ctx.globalAlpha = pt.alpha; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
      }

      drawDamageFlash();               // 피격 붉은 화면
      drawStageOverlay();
      drawHUD();
      drawRespawnNotice();
      if (ult.phase === 'IMPACT') { updateUltimate(); drawUltimate(); }   // 충격 후 손바닥 잔상·섬광·충격파
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
