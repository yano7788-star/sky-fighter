<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber Strike: Neon Warfare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050811; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    let gameState = 'START';
    let stateTimer = 0; 

    // ==========================================
    // 정밀 배경 투명화 엔진 (가짜 바둑판 체크무늬 완벽 제거)
    // ==========================================
    function removeFakeBackground(img) {
      try {
        const off = document.createElement('canvas');
        const w = img.naturalWidth, h = img.naturalHeight;
        off.width = w; off.height = h;
        const oCtx = off.getContext('2d', { willReadFrequently: true });
        oCtx.drawImage(img, 0, 0);

        const imgData = oCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        function getRGB(x, y) { return [data[(y*w+x)*4], data[(y*w+x)*4+1], data[(y*w+x)*4+2]]; }
        const corners = [getRGB(0,0), getRGB(w-1,0), getRGB(0,h-1), getRGB(w-1,h-1)];

        function isBg(r, g, b, a) {
          if (a === 0) return true;
          for(let c of corners) { if (Math.hypot(r - c[0], g - c[1], b - c[2]) < 45) return true; }
          if (Math.max(r, g, b) - Math.min(r, g, b) < 20 && r > 160) return true; 
          return false;
        }

        const visited = new Uint8Array(w * h);
        const queue = [];

        for (let x = 0; x < w; x++) { queue.push(x); visited[x] = 1; queue.push((h - 1) * w + x); visited[(h - 1) * w + x] = 1; }
        for (let y = 1; y < h - 1; y++) { queue.push(y * w); visited[y * w] = 1; queue.push(y * w + (w - 1)); visited[y * w + (w - 1)] = 1; }

        let head = 0;
        while (head < queue.length) {
          const pos = queue[head++];
          const qx = pos % w, qy = (pos / w) | 0, idx = pos * 4;

          if (isBg(data[idx], data[idx + 1], data[idx + 2], data[idx + 3])) {
            data[idx + 3] = 0; 
            if (qx + 1 < w && !visited[pos + 1]) { visited[pos + 1] = 1; queue.push(pos + 1); }
            if (qx - 1 >= 0 && !visited[pos - 1]) { visited[pos - 1] = 1; queue.push(pos - 1); }
            if (qy + 1 < h && !visited[pos + w]) { visited[pos + w] = 1; queue.push(pos + w); }
            if (qy - 1 >= 0 && !visited[pos - w]) { visited[pos - w] = 1; queue.push(pos - w); }
          }
        }
        oCtx.putImageData(imgData, 0, 0);
        return off;
      } catch(e) { return img; }
    }

    const startScreenImg = new Image();
    let isStartScreenLoaded = false;
    startScreenImg.src = 'Startscreen.png';
    startScreenImg.onload = () => { isStartScreenLoaded = true; };

    const playerImg = new Image();
    let cleanPlayerCanvas = null, isPlayerImgLoaded = false;
    playerImg.src = 'player.png';
    playerImg.onload = () => { cleanPlayerCanvas = removeFakeBackground(playerImg); isPlayerImgLoaded = true; };

    const bombBtnImg = new Image();
    let cleanBombBtnCanvas = null, isBombBtnLoaded = false;
    bombBtnImg.src = 'bomb.png';
    bombBtnImg.onload = () => { cleanBombBtnCanvas = removeFakeBackground(bombBtnImg); isBombBtnLoaded = true; };

    const bossData = {};
    for (let i = 1; i <= 5; i++) {
      bossData[i] = { img: new Image(), cleanCanvas: null, loaded: false };
      bossData[i].img.onload = () => { bossData[i].cleanCanvas = removeFakeBackground(bossData[i].img); bossData[i].loaded = true; };
      bossData[i].img.src = `boss${i}.png`;
    }

    // ==========================================
    // 사운드 엔진
    // ==========================================
    let audioCtx = null, bgmGain = null, isMuted = false, bgmStep = 0, nextNoteTime = 0, isBgmRunning = false;
    const NOTES = { C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94, C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, REST:0 };
    const normalBgmNotes = [
      {bass:NOTES.A3, lead:NOTES.A4}, {bass:NOTES.A3, lead:NOTES.C5}, {bass:NOTES.A3, lead:NOTES.E5}, {bass:NOTES.A3, lead:NOTES.A4},
      {bass:NOTES.F3, lead:NOTES.F4}, {bass:NOTES.F3, lead:NOTES.A4}, {bass:NOTES.F3, lead:NOTES.C5}, {bass:NOTES.F3, lead:NOTES.F5},
      {bass:NOTES.G3, lead:NOTES.G4}, {bass:NOTES.G3, lead:NOTES.B4}, {bass:NOTES.G3, lead:NOTES.D5}, {bass:NOTES.G3, lead:NOTES.G5},
      {bass:NOTES.E3, lead:NOTES.E4}, {bass:NOTES.E3, lead:NOTES.G4}, {bass:NOTES.E3, lead:NOTES.B4}, {bass:NOTES.E3, lead:NOTES.E5}
    ];
    const bossBgmNotes = [
      {bass:NOTES.D3, lead:NOTES.D5}, {bass:NOTES.D3, lead:NOTES.REST}, {bass:NOTES.D3, lead:NOTES.F5}, {bass:NOTES.D3, lead:NOTES.D5},
      {bass:NOTES.C3, lead:NOTES.C5}, {bass:NOTES.C3, lead:NOTES.REST}, {bass:NOTES.C3, lead:NOTES.E5}, {bass:NOTES.C3, lead:NOTES.C5},
      {bass:NOTES.B3, lead:NOTES.B4}, {bass:NOTES.B3, lead:NOTES.REST}, {bass:NOTES.B3, lead:NOTES.D5}, {bass:NOTES.B3, lead:NOTES.B4},
      {bass:NOTES.C3, lead:NOTES.C5}, {bass:NOTES.D3, lead:NOTES.D5}, {bass:NOTES.E3, lead:NOTES.E5}, {bass:NOTES.F3, lead:NOTES.F5}
    ];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmGain = audioCtx.createGain(); bgmGain.gain.setValueAtTime(0.08, audioCtx.currentTime); bgmGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!isBgmRunning) { isBgmRunning = true; nextNoteTime = audioCtx.currentTime + 0.05; }
    }

    function playTone(freq, type, duration, startTime, vol=0.1) {
      if (!audioCtx || freq===0 || isMuted) return;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain); gain.connect(bgmGain); osc.start(startTime); osc.stop(startTime + duration);
    }

    function updateBgmScheduler() {
      if (!isBgmRunning || !audioCtx || gameState !== 'PLAYING') return;
      const tempo = boss ? 155 : 130, stepDuration = 60 / tempo / 4;
      while (nextNoteTime < audioCtx.currentTime + 0.15) {
        const currentStep = (boss ? bossBgmNotes : normalBgmNotes)[bgmStep % normalBgmNotes.length];
        playTone(currentStep.bass, 'triangle', stepDuration * 0.9, nextNoteTime, 0.22);
        playTone(currentStep.lead, 'square', stepDuration * 0.6, nextNoteTime, 0.08);
        nextNoteTime += stepDuration; bgmStep++;
      }
    }

    function playSound(type) {
      if (!audioCtx || isMuted || gameState !== 'PLAYING') return;
      try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); const t = audioCtx.currentTime;
        if (type === 'laser') { osc.type='square'; osc.frequency.setValueAtTime(820,t); osc.frequency.exponentialRampToValueAtTime(200,t+0.07); gain.gain.setValueAtTime(0.08,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.07); osc.start(t); osc.stop(t+0.07); }
        else if (type === 'missile') { osc.type='sawtooth'; osc.frequency.setValueAtTime(280,t); osc.frequency.exponentialRampToValueAtTime(600,t+0.1); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.start(t); osc.stop(t+0.1); }
        else if (type === 'boom') { osc.type='sawtooth'; osc.frequency.setValueAtTime(140,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.4); gain.gain.setValueAtTime(0.4,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.4); osc.start(t); osc.stop(t+0.4); }
        else if (type === 'item') { osc.type='sine'; osc.frequency.setValueAtTime(440,t); osc.frequency.exponentialRampToValueAtTime(1100,t+0.16); gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.16); osc.start(t); osc.stop(t+0.16); }
        else if (type === 'heal') { osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(800,t+0.25); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.25); osc.start(t); osc.stop(t+0.25); }
      } catch(e) {}
    }

    // ==========================================
    // 게임 데이터
    // ==========================================
    const stars = Array.from({length: 65}, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.8 + 0.5, speed: Math.random() * 2 + 0.8 }));
    let score = 0, weaponLevel = 1, hasHomingMissile = false, missileTimer = 0, frame = 0, bombs = 1, bombFlash = 0;
    let bossTier = 1, boss = null, nextBossScore = 250, bossWarningTimer = 0;

    const BOSS_CONFIGS = {
      1: { name: 'STAGE 1: TANK BUSTER', hp: 80, color: '#4d7c0f', subColor: '#bef264', w: 130, h: 110, shotCd: 45 },
      2: { name: 'STAGE 2: CYBER STEALTH', hp: 160, color: '#0284c7', subColor: '#38bdf8', w: 140, h: 120, shotCd: 40 },
      3: { name: 'STAGE 3: AEGIS FLAGSHIP', hp: 270, color: '#ca8a04', subColor: '#facc15', w: 150, h: 130, shotCd: 35 },
      4: { name: 'STAGE 4: HEAVY DESTROYER', hp: 420, color: '#b91c1c', subColor: '#f87171', w: 155, h: 135, shotCd: 30 },
      5: { name: 'STAGE 5: VOID ARCHANGEL', hp: 650, color: '#7e22ce', subColor: '#c084fc', w: 165, h: 150, shotCd: 26 }
    };

    const player = { x: canvas.width/2, y: canvas.height-140, targetX: canvas.width/2, targetY: canvas.height-140, radius: 22, energy: 100, maxEnergy: 100, displayEnergy: 100, invincible: 0 };
    const bullets = [], missiles = [], enemyBullets = [], enemies = [], particles = [], items = [];

    // ==========================================
    // 조작 및 폭탄
    // ==========================================
    function isBombButtonHit(x, y) { return Math.hypot(x - (canvas.width - 55), y - (canvas.height - 65)) < 45; }
    function checkSoundButtonTap(x, y) {
      if (Math.hypot(x - (canvas.width - 45), y - 30) < 25) {
        isMuted = !isMuted; if (bgmGain) bgmGain.gain.setValueAtTime(isMuted ? 0 : 0.08, audioCtx.currentTime);
        return true;
      } return false;
    }

    function fireBomb() {
      if (bombs <= 0 || gameState !== 'PLAYING') return;
      bombs--; playSound('boom'); bombFlash = 1.0; 
      enemyBullets.length = 0; 
      enemies.forEach(e => { e.hp = 0; });
      if (boss) { boss.hp -= 40; spawnExplosion(boss.x, boss.y, '#ef4444', 30); }
    }

    function handlePointer(x, y, isTap) {
      if (gameState === 'START') { if (isTap) { initAudio(); restartGame(); } return; }
      if (gameState === 'GAMEOVER' || gameState === 'GAMECLEAR') { if(isTap && stateTimer <= 0) restartGame(); return; }
      if (isTap) {
        if (checkSoundButtonTap(x, y)) return;
        if (isBombButtonHit(x, y)) { fireBomb(); return; }
      } else {
        if (Math.hypot(x - (canvas.width - 45), y - 30) < 30) return;
        if (Math.hypot(x - (canvas.width - 55), y - (canvas.height - 65)) < 45) return;
      }
      player.targetX = x; player.targetY = y - 50;
    }

    canvas.addEventListener('touchstart', e => { handlePointer(e.touches[0].clientX, e.touches[0].clientY, true); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); if (gameState === 'PLAYING') handlePointer(e.touches[0].clientX, e.touches[0].clientY, false); }, { passive: false });
    canvas.addEventListener('mousedown', e => { handlePointer(e.clientX, e.clientY, true); });
    canvas.addEventListener('mousemove', e => { if (gameState === 'PLAYING' && e.buttons === 1) handlePointer(e.clientX, e.clientY, false); });

    function spawnExplosion(x, y, color, count=12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, spd = Math.random() * 5 + 2;
        particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, r: Math.random()*3+1.5, alpha: 1, color });
      }
    }

    function applyDamage(dmg) {
      if (player.invincible > 0 || gameState !== 'PLAYING') return;
      player.energy = Math.max(0, player.energy - dmg);
      player.invincible = 40;
      playSound('boom'); spawnExplosion(player.x, player.y, '#ef4444', 16);
      if (player.energy <= 0) { gameState = 'GAMEOVER'; stateTimer = 90; }
    }

    function spawnBoss(tier) {
      bossWarningTimer = 110; const config = BOSS_CONFIGS[tier];
      boss = { tier, name: config.name, x: canvas.width/2, y: -120, targetY: 135, width: config.w, height: config.h, vx: 2.3 + tier*0.25, hp: config.hp, maxHp: config.hp, displayHp: config.hp, shootCooldown: 0, attackMode: 1, color: config.color, subColor: config.subColor, shotCdMax: config.shotCd };
    }

    function restartGame() {
      score = 0; bossTier = 1; player.energy = 100; player.displayEnergy = 100; player.invincible = 0;
      weaponLevel = 1; hasHomingMissile = false; missileTimer = 0; boss = null; nextBossScore = 250; bossWarningTimer = 0; 
      bombs = 1; bombFlash = 0; 
      bullets.length=0; missiles.length=0; enemyBullets.length=0; enemies.length=0; particles.length=0; items.length=0;
      player.x = canvas.width/2; player.y = canvas.height-140; player.targetX = player.x; player.targetY = player.y;
      gameState = 'PLAYING';
    }

    // ==========================================
    // 렌더링 파트
    // ==========================================
    function drawStartScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (isStartScreenLoaded) {
        const ir = startScreenImg.naturalWidth / startScreenImg.naturalHeight, cr = canvas.width / canvas.height;
        let dw = canvas.width, dh = canvas.width / ir, dx = 0, dy = (canvas.height - dh) / 2;
        if (cr <= ir) { dh = canvas.height; dw = canvas.height * ir; dx = (canvas.width - dw) / 2; dy = 0; }
        ctx.drawImage(startScreenImg, dx, dy, dw, dh);

        const btnW = Math.min(canvas.width * 0.72, 320), btnH = 58, btnX = (canvas.width - btnW) / 2, btnY = canvas.height * 0.84;
        ctx.save(); const pulse = 0.5 + Math.sin(frame * 0.1) * 0.5;
        ctx.strokeStyle = `rgba(56, 189, 248, ${0.4 + pulse * 0.6})`;
        ctx.lineWidth = 3; ctx.shadowColor = '#06b6d4'; ctx.shadowBlur = 14 * pulse;
        ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 12); ctx.stroke(); ctx.restore();
      } else {
        ctx.fillStyle = '#050811'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('CYBER STRIKE', canvas.width / 2, canvas.height * 0.35);
        ctx.fillStyle = '#c084fc'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('NEON WARFARE', canvas.width / 2, canvas.height * 0.41);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('TAP TO START', canvas.width / 2, canvas.height * 0.82 + 34);
      }
    }

    function drawPlayerFighter(x, y) {
      ctx.save(); ctx.translate(x, y);
      if (player.invincible > 0 && Math.floor(frame / 4) % 2 === 0) ctx.globalAlpha = 0.4;

      if (isPlayerImgLoaded && cleanPlayerCanvas) {
        const targetWidth = 100;
        const aspect = cleanPlayerCanvas.height / cleanPlayerCanvas.width;
        const targetHeight = targetWidth * aspect;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cleanPlayerCanvas, -targetWidth / 2, -targetHeight / 2, targetWidth, targetHeight);
        ctx.imageSmoothingEnabled = true;
      } else {
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(15,15); ctx.lineTo(-15,15); ctx.fill();
      }
      ctx.restore();
    }

    function drawBossEntity(b) {
      ctx.save(); ctx.translate(b.x, b.y);
      if (bossData[b.tier] && bossData[b.tier].loaded && bossData[b.tier].cleanCanvas) {
        const img = bossData[b.tier].cleanCanvas;
        ctx.rotate(Math.PI);
        const scale = Math.min(b.width / img.width, b.height / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
        ctx.imageSmoothingEnabled = true;
      } else {
        ctx.fillStyle = '#ef4444'; ctx.fillRect(-b.width/2, -b.height/2, b.width, b.height);
      }
      ctx.restore();
    }

    function drawHUD() {
      const barX = 16, barY = 80, barWidth = 14, barHeight = 150;
      player.displayEnergy += (player.energy - player.displayEnergy) * 0.15;
      const fillRatio = Math.max(0, Math.min(1, player.displayEnergy / player.maxEnergy)), currentFillH = barHeight * fillRatio;
      ctx.save(); ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ENG', barX + barWidth/2, barY - 14);
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`${Math.round(player.energy)}%`, barX + barWidth/2, barY - 2);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)'; ctx.beginPath(); ctx.roundRect(barX, barY, barWidth, barHeight, 7); ctx.fill();
      let energyColor = player.energy <= 25 ? (frame % 8 < 4 ? '#ef4444' : '#fee2e2') : player.energy <= 55 ? '#f59e0b' : '#10b981';
      if (currentFillH > 0) { ctx.fillStyle = energyColor; ctx.beginPath(); ctx.roundRect(barX + 2, barY + (barHeight - currentFillH) + 2, barWidth - 4, currentFillH - 4, 5); ctx.fill(); }
      ctx.strokeStyle = energyColor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(barX, barY, barWidth, barHeight, 7); ctx.stroke();
      ctx.restore();

      const bx = canvas.width - 55, by = canvas.height - 65, br = 35;
      ctx.save();
      if (isBombBtnLoaded && cleanBombBtnCanvas) {
        ctx.globalAlpha = bombs > 0 ? 1.0 : 0.4;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cleanBombBtnCanvas, bx - br, by - br, br * 2, br * 2);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.font = 'bold 22px sans-serif'; ctx.fillText(`x${bombs}`, bx, by + 8);
      } else {
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2);
        ctx.fillStyle = bombs > 0 ? 'rgba(6, 182, 212, 0.8)' : 'rgba(100, 116, 139, 0.5)'; ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('BOMB', bx, by - 2);
        ctx.font = 'bold 16px sans-serif'; ctx.fillText(`x${bombs}`, bx, by + 16);
      }
      ctx.restore();

      if (bombFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${bombFlash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); bombFlash -= 0.04;
      }

      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`SCORE ${score}`, 50, 34);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`STAGE ${bossTier}`, canvas.width / 2, 34);
      if (hasHomingMissile) { ctx.fillStyle = '#ec4899'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`MISSILE (${Math.ceil(missileTimer / 60)}s)`, 50, 52); }
      ctx.fillStyle = isMuted ? '#64748b' : '#38bdf8'; ctx.font = '18px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(isMuted ? '🔇' : '🔊', canvas.width - 25, 36);
    }

    // ==========================================
    // 메인 게임 루프
    // ==========================================
    function loop() {
      frame++;
      if (stateTimer > 0) stateTimer--;
      
      if (gameState === 'START') { drawStartScreen(); requestAnimationFrame(loop); return; }
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f87171'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MISSION OVER', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2 + 10); ctx.fillText(`최종 도달: STAGE ${bossTier}`, canvas.width / 2, canvas.height / 2 + 42);
        ctx.fillStyle = stateTimer > 0 ? '#94a3b8' : '#38bdf8'; ctx.font = '16px sans-serif'; ctx.fillText('화면을 탭하여 다시 출격', canvas.width / 2, canvas.height / 2 + 90);
        requestAnimationFrame(loop); return;
      }
      if (gameState === 'GAMECLEAR') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MISSION CLEAR!', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('지구의 평화를 지켰습니다.', canvas.width / 2, canvas.height / 2 + 5);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2 + 45); 
        ctx.fillStyle = stateTimer > 0 ? '#94a3b8' : '#38bdf8'; ctx.font = '16px sans-serif'; ctx.fillText('화면을 탭하여 타이틀로', canvas.width / 2, canvas.height / 2 + 100);
        requestAnimationFrame(loop); return;
      }

      if (player.invincible > 0) player.invincible--;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateBgmScheduler();

      ctx.fillStyle = '#94a3b8';
      stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); });

      player.x += (player.targetX - player.x) * 0.25; player.y += (player.targetY - player.y) * 0.25;
      player.x = Math.max(38, Math.min(canvas.width - 38, player.x)); player.y = Math.max(45, Math.min(canvas.height - 45, player.y));
      drawPlayerFighter(player.x, player.y);

      if (frame % 8 === 0) {
        playSound('laser');
        if (weaponLevel === 1) { bullets.push({ x: player.x - 18, y: player.y - 25, vx: 0, vy: -13 }); bullets.push({ x: player.x + 18, y: player.y - 25, vx: 0, vy: -13 }); }
        else if (weaponLevel === 2) { bullets.push({ x: player.x - 22, y: player.y - 20, vx: -1, vy: -13 }); bullets.push({ x: player.x, y: player.y - 36, vx: 0, vy: -13 }); bullets.push({ x: player.x + 22, y: player.y - 20, vx: 1, vy: -13 }); }
        else { bullets.push({ x: player.x - 26, y: player.y - 18, vx: -2.5, vy: -13 }); bullets.push({ x: player.x - 12, y: player.y - 30, vx: 0, vy: -13 }); bullets.push({ x: player.x + 12, y: player.y - 30, vx: 0, vy: -13 }); bullets.push({ x: player.x + 26, y: player.y - 18, vx: 2.5, vy: -13 }); }
      }

      if (hasHomingMissile) {
        missileTimer--; if (missileTimer <= 0) hasHomingMissile = false;
        if (frame % 18 === 0) { playSound('missile'); missiles.push({ x: player.x - 26, y: player.y, vx: -3, vy: -5, speed: 7.5 }); missiles.push({ x: player.x + 26, y: player.y, vx: 3, vy: -5, speed: 7.5 }); }
      }

      ctx.fillStyle = '#fde047';
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.x += b.vx; b.y += b.vy; ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill();
        if (b.y < -15 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i]; let target = boss;
        if (!target && enemies.length > 0) { let minDist = Infinity; enemies.forEach(e => { const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < minDist) { minDist = d; target = e; } }); }
        if (target) {
          const desired = Math.atan2(target.y - m.y, target.x - m.x), current = Math.atan2(m.vy, m.vx); let diff = desired - current;
          while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
          const newAng = current + diff * 0.14; m.vx = Math.cos(newAng) * m.speed; m.vy = Math.sin(newAng) * m.speed;
        }
        m.x += m.vx; m.y += m.vy;
        if (frame % 2 === 0) particles.push({ x: m.x, y: m.y, vx: (Math.random() - 0.5)*1.5, vy: (Math.random() - 0.5)*1.5, r: 2, alpha: 0.8, color: '#ec4899' });
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
        ctx.fillStyle = '#f43f5e'; ctx.fillRect(-2.5, -7, 5, 14); ctx.fillStyle = '#fbcfe8'; ctx.fillRect(-1.5, -9, 3, 4); ctx.restore();
        if (m.y < -30 || m.y > canvas.height + 30 || m.x < -30 || m.x > canvas.width + 30) missiles.splice(i, 1);
      }

      if (!boss && score >= nextBossScore) spawnBoss(bossTier);
      if (bossWarningTimer > 0) {
        bossWarningTimer--; ctx.fillStyle = '#ef4444'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        if (Math.floor(frame / 10) % 2 === 0) ctx.fillText(`⚠ WARNING: ${BOSS_CONFIGS[bossTier].name} ⚠`, canvas.width / 2, canvas.height / 2 - 80);
      }

      // 보스 2종류 공격 패턴 및 느려진 미사일 속도 적용
      if (boss) {
        if (boss.y < boss.targetY) boss.y += 1.5;
        else {
          boss.x += boss.vx; if (boss.x < boss.width / 2 + 10 || boss.x > canvas.width - boss.width / 2 - 10) boss.vx *= -1;
          boss.shootCooldown++;
          if (boss.shootCooldown > boss.shotCdMax) {
            boss.shootCooldown = 0;
            boss.attackMode = boss.attackMode === 1 ? 2 : 1; // 패턴 번갈아 발사
            
            if (boss.tier === 1) {
              if(boss.attackMode === 1) [-20, 20].forEach(ox => enemyBullets.push({ x: boss.x+ox, y: boss.y+35, vx: 0, vy: 3.5, color: '#facc15', r: 4 }));
              else [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*2, vy: Math.cos(ang)*2, color: '#ea580c', r: 5 }));
            }
            else if (boss.tier === 2) {
              if(boss.attackMode === 1) [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*4.5, vy: Math.cos(ang)*4.5, color: '#38bdf8', r: 4 }));
              else [-0.5, -0.25, 0, 0.25, 0.5].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*2.2, vy: Math.cos(ang)*2.2, color: '#0284c7', r: 5 }));
            }
            else if (boss.tier === 3) {
              if(boss.attackMode === 1) [-0.4, -0.2, 0, 0.2, 0.4].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*3.8, vy: Math.cos(ang)*3.8, color: '#fbbf24', r: 4 }));
              else [-0.6, -0.4, -0.2, 0, 0.2, 0.4, 0.6].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*1.8, vy: Math.cos(ang)*1.8, color: '#fef08a', r: 6 }));
            }
            else if (boss.tier === 4) {
              if(boss.attackMode === 1) [-0.3, -0.1, 0.1, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*4, vy: Math.cos(ang)*4, color: '#f87171', r: 4 }));
              else for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a; enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.cos(ang)*2, vy: Math.sin(ang)*2, color: '#991b1b', r: 5 }); }
            }
            else if (boss.tier === 5) {
              if(boss.attackMode === 1) {
                for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a + frame*0.05; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*4, vy: Math.sin(ang)*4, color: '#c084fc', r: 4 }); }
              } else {
                for(let a=0; a<12; a++) { const ang = (Math.PI*2/12)*a - frame*0.02; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*2, vy: Math.sin(ang)*2, color: '#f472b6', r: 6 }); }
              }
            }
          }
        }
        drawBossEntity(boss);
        boss.displayHp += (boss.hp - boss.displayHp) * 0.15; const barW = canvas.width * 0.7, barX = (canvas.width - barW) / 2 + 10;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(barX, 58, barW, 12);
        ctx.fillStyle = boss.color; ctx.fillRect(barX, 58, barW * Math.max(0, boss.displayHp / boss.maxHp), 12);
        ctx.strokeStyle = boss.subColor; ctx.lineWidth = 1.5; ctx.strokeRect(barX, 58, barW, 12);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${boss.name} (${Math.max(0, boss.hp)} / ${boss.maxHp})`, canvas.width / 2 + 10, 52);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.width / 2) { bullets.splice(j, 1); boss.hp--; spawnExplosion(b.x, b.y, '#f59e0b', 3); }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (Math.hypot(ms.x - boss.x, ms.y - boss.y) < boss.width / 2) { missiles.splice(m, 1); boss.hp -= 3; playSound('boom'); spawnExplosion(ms.x, ms.y, '#ec4899', 10); }
        }
        if (Math.hypot(player.x - boss.x, player.y - boss.y) < boss.width / 2 + 10) applyDamage(50);
        
        if (boss.hp <= 0) {
          playSound('boom'); spawnExplosion(boss.x, boss.y, boss.subColor, 50); score += 200 * boss.tier; 
          
          if (bossTier === 5) {
            gameState = 'GAMECLEAR'; stateTimer = 90; boss = null;
          } else {
            nextBossScore = score + 450; bossTier++; boss = null;
          }
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy; 
        const r = eb.r || 4;
        ctx.fillStyle = eb.color || '#fb7185'; ctx.beginPath(); ctx.arc(eb.x, eb.y, r, 0, Math.PI * 2); ctx.fill();
        if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + r) { enemyBullets.splice(i, 1); applyDamage(20); continue; }
        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20 || eb.y < -20) enemyBullets.splice(i, 1);
      }

      if (frame % (boss ? 70 : 32) === 0) enemies.push({ x: Math.random() * (canvas.width - 70) + 45, y: -30, hp: 1, speed: 3.2 + Math.random() * 1.5 });
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i]; e.y += e.speed;
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI); ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(18, 10); ctx.lineTo(-18, 10); ctx.closePath(); ctx.fill(); ctx.restore();

        // 일반 적의 느린 미사일 발사 로직 추가
        if (Math.random() < 0.008) {
          enemyBullets.push({ x: e.x, y: e.y + 10, vx: 0, vy: 2, color: '#fda4af', r: 3 });
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (Math.hypot(b.x - e.x, b.y - e.y) < 20) { bullets.splice(j, 1); e.hp = 0; break; }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (Math.hypot(ms.x - e.x, ms.y - e.y) < 22) { missiles.splice(m, 1); e.hp = 0; break; }
        }
        if (e.hp <= 0) {
          playSound('boom'); spawnExplosion(e.x, e.y, '#ef4444', 12); score += 10;
          
          const rand = Math.random();
          if (rand < 0.05) items.push({ x: e.x, y: e.y, type: 'P' });
          else if (rand < 0.09) items.push({ x: e.x, y: e.y, type: 'M' });
          else if (rand < 0.13) items.push({ x: e.x, y: e.y, type: 'E' });
          else if (rand < 0.15) items.push({ x: e.x, y: e.y, type: 'B' }); 

          enemies.splice(i, 1); continue;
        }
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + 14) { enemies.splice(i, 1); applyDamage(35); continue; }
        if (e.y > canvas.height + 30) enemies.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.y += 2.2;
        ctx.fillStyle = it.type === 'M' ? '#ec4899' : it.type === 'E' ? '#06b6d4' : it.type === 'B' ? '#ef4444' : '#10b981';
        ctx.beginPath(); ctx.arc(it.x, it.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.type, it.x, it.y);

        if (Math.hypot(player.x - it.x, player.y - it.y) < player.radius + 12) {
          if (it.type === 'P') weaponLevel = Math.min(3, weaponLevel + 1);
          else if (it.type === 'M') { hasHomingMissile = true; missileTimer = 500; }
          else if (it.type === 'E') { playSound('heal'); player.energy = Math.min(player.maxEnergy, player.energy + 30); spawnExplosion(player.x, player.y, '#06b6d4', 10); }
          else if (it.type === 'B') { 
            playSound('item'); 
            bombs = Math.min(2, bombs + 1); 
            spawnExplosion(player.x, player.y, '#ef4444', 10); 
          }
          items.splice(i, 1);
        } else if (it.y > canvas.height + 20) items.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.035;
        if (pt.alpha <= 0) particles.splice(i, 1);
        else { ctx.save(); ctx.globalAlpha = pt.alpha; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
      }

      drawHUD();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
