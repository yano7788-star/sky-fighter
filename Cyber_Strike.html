      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }

    // 글자 '잉크' 영역의 중심이 (cx, cy)에 오도록 정확히 가운데 정렬 (font/fillStyle은 미리 설정)
    function drawTextCentered(text, cx, cy) {
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';   // 반드시 측정 전에 고정 (측정값이 정렬/기준선에 따라 달라짐)
      const m = ctx.measureText(text);
      if (m.actualBoundingBoxAscent === undefined) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, cy);
      } else {
        const x = cx - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
        const y = cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
        ctx.fillText(text, x, y);
      }
      ctx.restore();
    }

    function bannerAlpha(t, total, fadeIn = 18, fadeOut = 24) {
      return Math.max(0, Math.min(1, t / fadeIn, (total - t) / fadeOut));
    }

    // 경고 / 스테이지 클리어 / 다음 스테이지 도입 배너
    function drawStageOverlay() {
      if (stagePhase !== 'WARNING' && stagePhase !== 'CLEAR' && stagePhase !== 'INTRO') return;
      const cx = canvas.width / 2, cy = canvas.height * 0.36;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 10;

      if (stagePhase === 'WARNING') {
        const total = PHASE_FRAMES.WARNING, t = total - phaseTimer;
        const a = bannerAlpha(t, total, 12, 20);
        ctx.fillStyle = `rgba(239, 68, 68, ${(0.06 + 0.05 * Math.sin(frame * 0.25)) * a})`;   // 붉은 화면 점멸
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = a;
        if (Math.floor(frame / 10) % 2 === 0) {
          ctx.fillStyle = '#ef4444'; ctx.font = 'bold 30px sans-serif';
          ctx.fillText('⚠ WARNING ⚠', cx, cy);
        }
        ctx.fillStyle = '#fca5a5'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText(BOSS_CONFIGS[bossTier].name, cx, cy + 34);
      } else if (stagePhase === 'CLEAR') {
        const total = PHASE_FRAMES.CLEAR, t = total - phaseTimer;
        ctx.globalAlpha = bannerAlpha(t, total, 15, 25);
        ctx.fillStyle = '#10b981'; ctx.font = 'bold 34px sans-serif';
        ctx.fillText(`STAGE ${bossTier} CLEAR!`, cx, cy);
        ctx.fillStyle = '#facc15'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`BOSS BONUS +${clearBonus}`, cx, cy + 36);
        if (ult.justGranted) {
          ctx.fillStyle = '#67e8f9'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('★ 궁극의 필살기 획득! ★', cx, cy + 68);
          ctx.fillStyle = '#cbd5e1'; ctx.font = '13px sans-serif'; ctx.fillText('화면 하단 버튼으로 1회 사용', cx, cy + 90);
        }
      } else {
        const total = PHASE_FRAMES.INTRO - 15, t = PHASE_FRAMES.INTRO - phaseTimer - 15;   // 배경이 바뀌기 시작한 뒤에 등장
        const cfg = BOSS_CONFIGS[bossTier];
        ctx.globalAlpha = bannerAlpha(t, total, 20, 30);
        ctx.fillStyle = cfg.subColor; ctx.font = 'bold 40px sans-serif';
        ctx.fillText(`STAGE ${bossTier}`, cx, cy);
        ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText(cfg.name.replace(/^STAGE \d+:\s*/, ''), cx, cy + 34);
      }
      ctx.restore();
    }

    // 목숨 소모 부활 알림: "♥ LIFE -1 / 부활! 에너지 100% / 남은 목숨 N" (팝인 → 유지 → 페이드아웃)
    function drawRespawnNotice() {
      if (respawnFx.t <= 0) return;
      const t = RESPAWN_FRAMES - respawnFx.t;
      respawnFx.t--;
      const s = 0.6 + 0.4 * easeOutBack(Math.min(1, t / 14)), out = Math.min(1, respawnFx.t / 25);
      const left = lives > 0 ? `남은 목숨 ${lives}` : '⚠ 마지막 목숨입니다';
      const title = respawnFx.title || '♥ LIFE -1', msg = respawnFx.msg || '부활! 에너지 100%', tcol = respawnFx.color || '#fb7185';
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height * 0.24); ctx.scale(s, s);
      ctx.globalAlpha = Math.min(1, t / 8) * out;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
      ctx.font = 'bold 34px sans-serif'; ctx.strokeText(title, 0, 0); ctx.fillStyle = tcol; ctx.fillText(title, 0, 0);
      ctx.lineWidth = 4;
      ctx.font = 'bold 16px sans-serif'; ctx.strokeText(msg, 0, 32); ctx.fillStyle = '#fef08a'; ctx.fillText(msg, 0, 32);
      ctx.font = 'bold 14px sans-serif'; ctx.strokeText(left, 0, 56); ctx.fillStyle = lives > 0 ? '#e2e8f0' : '#f87171'; ctx.fillText(left, 0, 56);
      ctx.restore();
    }

    function drawHUD() {
      // 1. 에너지 바
      const barX = 16, barY = 80, barWidth = 14, barHeight = 150;
      if (respawnFx.fill) {   // 부활: 바가 1.25초(75프레임)에 걸쳐 일정하게 차오름
        player.displayEnergy = Math.min(player.energy, player.displayEnergy + player.maxEnergy / 75);
        if (player.displayEnergy >= player.energy - 0.01) respawnFx.fill = false;
      } else player.displayEnergy += (player.energy - player.displayEnergy) * 0.15;
      const shownE = respawnFx.fill ? player.displayEnergy : player.energy;
      const fillRatio = Math.max(0, Math.min(1, player.displayEnergy / player.maxEnergy)), currentFillH = barHeight * fillRatio;
      ctx.save(); ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ENG', barX + barWidth/2, barY - 14);
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`${Math.round(shownE)}%`, barX + barWidth/2, barY - 2);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)'; ctx.beginPath(); ctx.roundRect(barX, barY, barWidth, barHeight, 7); ctx.fill();
      let energyColor = shownE <= 25 ? (frame % 8 < 4 ? '#ef4444' : '#fee2e2') : shownE <= 55 ? '#f59e0b' : '#10b981';
      if (currentFillH > 0) { ctx.fillStyle = energyColor; ctx.beginPath(); ctx.roundRect(barX + 2, barY + (barHeight - currentFillH) + 2, barWidth - 4, currentFillH - 4, 5); ctx.fill(); }
      ctx.strokeStyle = energyColor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(barX, barY, barWidth, barHeight, 7); ctx.stroke();
      if (companions.cat.active) { ctx.fillStyle = '#fb7185'; ctx.fillRect(barX - 4, barY + barHeight * (1 - LIFESTEAL_CAP) - 1, barWidth + 8, 2); }   // 흡혈 회복 상한(80%) 눈금
      ctx.restore();

      // 2. 폭탄 버튼 (우측 하단 세로 목록의 맨 아래)
      { const b = buttonAt('bomb'); drawBombButton(b.x, b.y, b.r); }

      drawCompanionButtons();
      drawUltButton();

      if (bombFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${(bombFlash * 0.85).toFixed(3)})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (bombFlash > 0.15) {   // 섬광이 잦아들 때 화면 가장자리에 주황 잔광
          const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * 0.18, canvas.width / 2, canvas.height / 2, canvas.height * 0.7);
          g.addColorStop(0, 'rgba(251, 146, 60, 0)'); g.addColorStop(1, `rgba(251, 146, 60, ${(bombFlash * 0.55).toFixed(3)})`);
          ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        bombFlash -= 0.028;
      }

      // 3. 상단 UI
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`SCORE ${score}`, 50, 34);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`STAGE ${bossTier}`, canvas.width / 2, 34);
      if (hasHomingMissile) { ctx.fillStyle = '#ec4899'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`MISSILE (${Math.ceil(missileTimer / 60)}s)`, 50, 52); }
      
      // 음소거 및 라이프 표시
      ctx.fillStyle = isMuted ? '#64748b' : '#38bdf8'; ctx.font = '18px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(isMuted ? '🔇' : '🔊', canvas.width - 25, 36);
      {   // life 표시: 하트마다 바깥 검정 + 안쪽 진한 적색의 이중 테두리, 우측 가장자리에 세로로 나열
        ctx.save(); ctx.font = '18px sans-serif'; ctx.textAlign = 'right'; ctx.lineJoin = 'round';
        for (let i = 0; i < Math.min(lives, 10); i++) {
          const hx = canvas.width - 24, hy = 98 + i * 24;   // 세로 배치: 보스 체력바(y 58~70)와 겹치지 않도록 그 아래 우측 가장자리에
          ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)'; ctx.strokeText('♥', hx, hy);
          ctx.lineWidth = 3.6; ctx.strokeStyle = '#9f1239'; ctx.strokeText('♥', hx, hy);
          ctx.fillStyle = '#f43f5e'; ctx.fillText('♥', hx, hy);
        }
        if (respawnFx.t > 0 && respawnFx.kind === 'loss' && lives < 10) {   // 방금 잃은 하트: 떨리다가 회색으로 떠오르며 사라짐
          const el = RESPAWN_FRAMES - respawnFx.t, gx = canvas.width - 24 + (el < 12 ? (Math.random() - 0.5) * 4 : 0), gy = 98 + lives * 24 - el * 0.15;
          ctx.globalAlpha = Math.max(0, respawnFx.t / RESPAWN_FRAMES);
          ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)'; ctx.strokeText('♥', gx, gy);
          ctx.fillStyle = '#94a3b8'; ctx.fillText('♥', gx, gy);
        }
        ctx.restore();
      }
    }

    // ==========================================
    // 메인 게임 루프
    // ==========================================
    function loop() {
      frame++;
      updateMusic();
      ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;   // 텍스트 기준선 등 상태가 프레임 간에 새지 않도록 초기화
      if (stateTimer > 0) stateTimer--;
      
      if (gameState === 'PLAYING' && ultFrozen()) {   // 필살기 컷인·낙하 연출: 게임 로직은 건너뛰고 정지 화면 위에만 그림
        const snap = ult.snap;
        updateUltimate();
        if (snap) ctx.drawImage(snap, 0, 0);
        drawUltimate();
        requestAnimationFrame(loop); return;
      }
      if (hitStop > 0 && gameState === 'PLAYING') { hitStop--; requestAnimationFrame(loop); return; }   // 히트스톱: 강한 타격 순간 화면을 몇 프레임 멈춤
      applyShake();
      if (gameState === 'START') { drawStartScreen(); requestAnimationFrame(loop); return; }
      
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(3, 5, 10, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f87171'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MISSION OVER', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2 + 10); ctx.fillText(`최종 도달: STAGE ${bossTier}`, canvas.width / 2, canvas.height / 2 + 42);
        ctx.fillStyle = stateTimer > 0 ? '#94a3b8' : '#38bdf8'; ctx.font = '16px sans-serif'; ctx.fillText('화면을 탭하여 다시 출격', canvas.width / 2, canvas.height / 2 + 90);
        requestAnimationFrame(loop); return;
      }
      if (gameState === 'GAMECLEAR') {
        ctx.fillStyle = 'rgba(3, 5, 10, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MISSION CLEAR!', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('지구의 평화를 지켰습니다.', canvas.width / 2, canvas.height / 2 + 5);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2 + 45); 
        ctx.fillStyle = stateTimer > 0 ? '#94a3b8' : '#38bdf8'; ctx.font = '16px sans-serif'; ctx.fillText('화면을 탭하여 타이틀로', canvas.width / 2, canvas.height / 2 + 100);
        requestAnimationFrame(loop); return;
      }

      if (player.invincible > 0) player.invincible--;

      // 스테이지별 배경 렌더링
      // (스테이지 전환 중에는 이전 배경 위로 새 배경을 서서히 겹쳐서 자연스럽게 교체)
      if (prevBgTier && bgFade < 1) {
        drawStageBackground(prevBgTier, true);
        ctx.save(); ctx.globalAlpha = bgFade; drawStageBackground(bgTier, false); ctx.restore();
        bgFade = Math.min(1, bgFade + 1 / 60);
        if (bgFade >= 1) prevBgTier = 0;
      } else {
        drawStageBackground(bgTier, true);
      }

      player.x += (player.targetX - player.x) * 0.25; player.y += (player.targetY - player.y) * 0.25;
      player.x = Math.max(38, Math.min(canvas.width - 38, player.x)); player.y = Math.max(45, Math.min(canvas.height - 45, player.y));
      updateCompanions();
      drawCompanionEffects();          // 흡혈 기운 + 동료 (플레이어 뒤)
      drawPlayerFighter(player.x, player.y);
      drawShield();                    // 방어막 (플레이어 위)
      updateDrainOrbs();               // 흡혈 회복 구슬
      updateBombWaves();               // 폭탄 충격파
      drawImpactFx();                  // 충격 링 + 총구 화염

      if (fireCd > 0) fireCd--;
      if (missileCd > 0) missileCd--;
      if (fireGrace > 0) fireGrace--;
      const wantFire = isFiring || fireGrace > 0;   // 화면을 누르고 있는 동안에만 발사

      if (wantFire && fireCd <= 0) {
        fireCd = 8;
        playSound('laser');
        const n0 = bullets.length; muzzleT = 3;   // 총구 화염
        if (weaponLevel === 1) { bullets.push({ x: player.x - 18, y: player.y - 25, vx: 0, vy: -13 }); bullets.push({ x: player.x + 18, y: player.y - 25, vx: 0, vy: -13 }); }
        else if (weaponLevel === 2) { bullets.push({ x: player.x - 22, y: player.y - 20, vx: -1, vy: -13 }); bullets.push({ x: player.x, y: player.y - 36, vx: 0, vy: -13 }); bullets.push({ x: player.x + 22, y: player.y - 20, vx: 1, vy: -13 }); }
        else { bullets.push({ x: player.x - 26, y: player.y - 18, vx: -2.5, vy: -13 }); bullets.push({ x: player.x - 12, y: player.y - 30, vx: 0, vy: -13 }); bullets.push({ x: player.x + 12, y: player.y - 30, vx: 0, vy: -13 }); bullets.push({ x: player.x + 26, y: player.y - 18, vx: 2.5, vy: -13 }); }
        if (companions.cat.active) for (let k = n0; k < bullets.length; k++) { bullets[k].hm = true; bullets[k].life = 110; }   // 흡혈 중: 모든 탄이 유도탄
      }

      if (hasHomingMissile) {
        missileTimer--; if (missileTimer <= 0) hasHomingMissile = false;
        if (wantFire && missileCd <= 0) { missileCd = 18; playSound('missile'); missiles.push({ x: player.x - 26, y: player.y, vx: -3, vy: -5, speed: 7.5 }); missiles.push({ x: player.x + 26, y: player.y, vx: 3, vy: -5, speed: 7.5 }); }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.hm) homeBullet(b);                                  // 흡혈 중 발사한 유도탄
        b.x += b.vx; b.y += b.vy;
        ctx.fillStyle = b.hm ? '#fb7185' : '#fde047';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.hm ? 4 : 3.5, 0, Math.PI * 2); ctx.fill();
        if (b.hm && --b.life <= 0) { bullets.splice(i, 1); continue; }
        if (b.y < -15 || b.y > canvas.height + 20 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i]; let target = (boss && !boss.dying) ? boss : (midBoss && !midBoss.dying ? midBoss : null);
        if (!target && enemies.length > 0) { let minDist = Infinity; enemies.forEach(e => { if (!enemyInView(e)) return; const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < minDist) { minDist = d; target = e; } }); }
        if (target) {
          const desired = Math.atan2(target.y - m.y, target.x - m.x), current = Math.atan2(m.vy, m.vx); let diff = desired - current;
          while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
          const newAng = current + diff * 0.14; m.vx = Math.cos(newAng) * m.speed; m.vy = Math.sin(newAng) * m.speed;
        }
        m.x += m.vx; m.y += m.vy;
        if (frame % 2 === 0) particles.push({ x: m.x, y: m.y, vx: (Math.random() - 0.5)*1.5, vy: (Math.random() - 0.5)*1.5, r: 2, alpha: 0.8, color: '#ec4899' });
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
        ctx.fillStyle = '#f43f5e'; ctx.fillRect(-2.5, -7, 5, 14); ctx.fillStyle = '#fbcfe8'; ctx.fillRect(-1.5, -9, 3, 4); ctx.restore();
        if (m.y < -30 || m.y > canvas.height + 30 || m.x < -30 || m.x > canvas.width + 30) missiles.splice(i, 1);
      }

      // =========================================================================
      // 스테이지 진행: 전투 → 경고 → 보스 → 폭발 → 클리어 → 다음 스테이지 도입
      // =========================================================================
      if (stagePhase === 'FIGHT') {
        if (midState.pending && !boss && !midBoss && score >= midState.at) { midState.pending = false; spawnMidBoss(bossTier); }
        else if (!boss && !midBoss && score >= nextBossScore) { stagePhase = 'WARNING'; phaseTimer = PHASE_FRAMES.WARNING; }
      } else if (stagePhase === 'WARNING') {
        if (--phaseTimer <= 0) { spawnBoss(bossTier); stagePhase = 'BOSS'; }
      } else if (stagePhase === 'BOSS_DYING') {
        if (--phaseTimer <= 0) {
          if (boss) { spawnExplosion(boss.x, boss.y, '#ffffff', 40); spawnExplosion(boss.x, boss.y, boss.subColor, 50); }
          playSound('boom'); bombFlash = 0.9; addShake(14); hitStop = Math.max(hitStop, 5);
          boss = null; stagePhase = 'CLEAR'; phaseTimer = PHASE_FRAMES.CLEAR;
        }
      } else if (stagePhase === 'CLEAR') {
        if (--phaseTimer <= 0) {
          if (bossTier >= 5) { gameState = 'GAMECLEAR'; stateTimer = 90; resetInput(); stopMusic(); }
          else beginNextStage();
        }
      } else if (stagePhase === 'INTRO') {
        if (--phaseTimer <= 0) stagePhase = 'FIGHT';
      }

      // =========================================================================
      // 보스 전투 로직 (체력 50% 이하 2페이즈 분기 및 고대비 렌더링)
      // =========================================================================
      if (boss) {
        if (!boss.dying && !boss.phase2 && boss.hp <= boss.maxHp * 0.5) {
          boss.phase2 = true;
          boss.phase2Alert = 80; 
          boss.shotCdMax = Math.max(16, Math.round(boss.shotCdMax * 0.74)); // 공격 주기 26% 가속
          boss.vx = (boss.vx > 0 ? 1 : -1) * (Math.abs(boss.vx) * 1.3);     // 이동 속도 30% 증속
          playSound('enrage');
          spawnExplosion(boss.x, boss.y, '#ef4444', 35);
          bombFlash = 0.5;
        }

        if (boss.dying) {
          // 폭발 중: 이동·공격 정지, 기체 위에서 연쇄 폭발
          boss.deathTimer++;
          if (boss.deathTimer % 5 === 0) {
            spawnExplosion(boss.x + (Math.random() - 0.5) * boss.width * 0.9, boss.y + (Math.random() - 0.5) * boss.height * 0.9,
                           Math.random() < 0.5 ? boss.subColor : '#f59e0b', 10);
          }
          if (boss.deathTimer % 16 === 1) playSound('boom');
        } else if (boss.y < boss.targetY) {
          boss.y += 1.5;
        } else {
          boss.x += boss.vx; 
          if (boss.x < boss.width / 2 + 10 || boss.x > canvas.width - boss.width / 2 - 10) boss.vx *= -1;
          
          boss.shootCooldown++;
          if (boss.shootCooldown > boss.shotCdMax) {
            boss.shootCooldown = 0;
            boss.attackMode = boss.attackMode === 1 ? 2 : 1; 
            
            const aimAngle = Math.atan2(player.y - boss.y, player.x - boss.x) - Math.PI / 2;

            if (!boss.phase2) {
              if (boss.tier === 1) {
                if (boss.attackMode === 1) [-20, 20].forEach(ox => enemyBullets.push({ x: boss.x+ox, y: boss.y+35, vx: 0, vy: 3.4, color: '#facc15', r: 4.5 }));
                else [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*2.0, vy: Math.cos(ang)*2.0, color: '#fb923c', r: 5.5 }));
              }
              else if (boss.tier === 2) {
                if (boss.attackMode === 1) [-0.3, 0, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*4.2, vy: Math.cos(ang)*4.2, color: '#38bdf8', r: 4.5 }));
                else [-0.5, -0.25, 0, 0.25, 0.5].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+40, vx: Math.sin(ang)*2.1, vy: Math.cos(ang)*2.1, color: '#06b6d4', r: 5.5 }));
              }
              else if (boss.tier === 3) {
                if (boss.attackMode === 1) [-0.4, -0.2, 0, 0.2, 0.4].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*3.6, vy: Math.cos(ang)*3.6, color: '#fde047', r: 4.5 }));
                else [-0.6, -0.3, 0, 0.3, 0.6].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+45, vx: Math.sin(ang)*1.8, vy: Math.cos(ang)*1.8, color: '#fef08a', r: 6.5 }));
              }
              else if (boss.tier === 4) {
                if (boss.attackMode === 1) [-0.3, -0.1, 0.1, 0.3].forEach(ang => enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.sin(ang)*3.8, vy: Math.cos(ang)*3.8, color: '#f87171', r: 4.5 }));
                else for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a; enemyBullets.push({ x: boss.x, y: boss.y+35, vx: Math.cos(ang)*2.0, vy: Math.sin(ang)*2.0, color: '#ef4444', r: 5.5 }); }
              }
              else if (boss.tier === 5) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<8; a++) { const ang = (Math.PI*2/8)*a + frame*0.04; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*3.8, vy: Math.sin(ang)*3.8, color: '#c084fc', r: 4.5 }); }
                } else {
                  for(let a=0; a<12; a++) { const ang = (Math.PI*2/12)*a - frame*0.02; enemyBullets.push({ x: boss.x, y: boss.y+20, vx: Math.cos(ang)*2.0, vy: Math.sin(ang)*2.0, color: '#f472b6', r: 6.5 }); }
                }
              }
            } else {
              if (boss.tier === 1) {
                if (boss.attackMode === 1) {
                  [-32, -12, 12, 32].forEach(ox => enemyBullets.push({ x: boss.x + ox, y: boss.y + 35, vx: 0, vy: 4.2, color: '#facc15', r: 4.8 }));
                } else {
                  [-0.22, 0, 0.22].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 35, vx: Math.sin(ang)*3.2, vy: Math.cos(ang)*3.2, color: '#ea580c', r: 6.5 });
                  });
                }
              }
              else if (boss.tier === 2) {
                if (boss.attackMode === 1) {
                  [-0.5, -0.33, -0.16, 0, 0.16, 0.33, 0.5].forEach(ang => {
                    enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.sin(ang)*4.8, vy: Math.cos(ang)*4.8, color: '#38bdf8', r: 4.5 });
                  });
                } else {
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI * 2 / 8) * a + (frame * 0.08);
                    enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.cos(ang)*2.4, vy: Math.sin(ang)*2.4, color: '#06b6d4', r: 5.5 });
                  }
                }
              }
              else if (boss.tier === 3) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI*2/8)*a + 0.39;
                    enemyBullets.push({ x: boss.x, y: boss.y + 45, vx: Math.cos(ang)*3.4, vy: Math.sin(ang)*3.4, color: '#facc15', r: 5.0 });
                  }
                } else {
                  [-0.35, -0.15, 0.15, 0.35].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 45, vx: Math.sin(ang)*2.2, vy: Math.cos(ang)*2.2, color: '#fef08a', r: 7.0 });
                  });
                }
              }
              else if (boss.tier === 4) {
                if (boss.attackMode === 1) {
                  [-40, -24, -8, 8, 24, 40].forEach(ox => {
                    enemyBullets.push({ x: boss.x + ox, y: boss.y + 35, vx: (ox/40)*1.2, vy: 4.0, color: '#f87171', r: 4.8 });
                  });
                } else {
                  for(let a=0; a<10; a++) {
                    const ang = (Math.PI * 2 / 10) * a;
                    enemyBullets.push({ x: boss.x, y: boss.y + 35, vx: Math.cos(ang)*2.2, vy: Math.sin(ang)*2.2, color: '#ef4444', r: 6.0 });
                  }
                }
              }
              else if (boss.tier === 5) {
                if (boss.attackMode === 1) {
                  for(let a=0; a<12; a++) {
                    const ang = (Math.PI*2/12)*a + frame*0.06;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang)*4.2, vy: Math.sin(ang)*4.2, color: '#c084fc', r: 4.8 });
                  }
                } else {
                  [-0.18, 0, 0.18].forEach(off => {
                    const ang = aimAngle + off;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.sin(ang)*5.2, vy: Math.cos(ang)*5.2, color: '#f472b6', r: 6.0 });
                  });
                  for(let a=0; a<8; a++) {
                    const ang = (Math.PI*2/8)*a - frame*0.03;
                    enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang)*1.8, vy: Math.sin(ang)*1.8, color: '#e879f9', r: 7.0 });
                  }
                }
              }
            }
          }
        }

        // 고대비 테두리가 적용된 보스 렌더링 호출
        drawBossEntity(boss);
        if (boss.hitFlash > 0) { boss.hitFlash--; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; drawBossEntity(boss); ctx.restore(); }   // 피격 시 밝게 번쩍

        if (boss.phase2Alert > 0) {
          boss.phase2Alert--;
          ctx.save();
          ctx.fillStyle = (frame % 8 < 4) ? '#ef4444' : '#facc15';
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 6;
          ctx.fillText('⚡ PHASE 2: OVERDRIVE ⚡', canvas.width / 2, canvas.height * 0.38);
          ctx.restore();
        }

        boss.displayHp += (boss.hp - boss.displayHp) * 0.15; 
        const barW = canvas.width * 0.7, barX = (canvas.width - barW) / 2 + 10;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(barX, 58, barW, 12);
        ctx.fillStyle = boss.phase2 ? ((frame % 6 < 3) ? '#ef4444' : '#f59e0b') : boss.color; 
        ctx.fillRect(barX, 58, barW * Math.max(0, boss.displayHp / boss.maxHp), 12);
        ctx.strokeStyle = boss.phase2 ? '#f87171' : boss.subColor; ctx.lineWidth = 1.5; ctx.strokeRect(barX, 58, barW, 12);
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; 
        const phaseLabel = boss.phase2 ? ' [PHASE 2]' : '';
        ctx.fillText(`${boss.name}${phaseLabel} (${Math.max(0, boss.hp)} / ${boss.maxHp})`, canvas.width / 2 + 10, 52);

        if (!boss.dying) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.width / 2) { bullets.splice(j, 1); boss.hp--; lifestealHit(b.x, b.y, 1); spawnExplosion(b.x, b.y, '#f59e0b', 3); boss.hitFlash = 3; hitSfx('hitb'); addRing(b.x, b.y, '#fde68a', 16, 8); }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (Math.hypot(ms.x - boss.x, ms.y - boss.y) < boss.width / 2) { missiles.splice(m, 1); boss.hp -= 3; lifestealHit(ms.x, ms.y, 3); playSound('boom'); boss.hitFlash = 5; addShake(2.5); addRing(ms.x, ms.y, '#f9a8d4', 30, 12); spawnExplosion(ms.x, ms.y, '#ec4899', 10); }
        }
        if (Math.hypot(player.x - boss.x, player.y - boss.y) < boss.width / 2 + 10) applyDamage(50);
        }
        
        // 체력이 0이 되어도 바로 사라지지 않고 '폭발 연출 → 클리어 → 다음 스테이지' 순서로 이어짐
        if (!boss.dying && boss.hp <= 0) {
          boss.dying = true; boss.deathTimer = 0; boss.hp = 0; boss.phase2Alert = 0;
          stagePhase = 'BOSS_DYING'; phaseTimer = PHASE_FRAMES.BOSS_DYING;
          clearBonus = 200 * boss.tier; score += clearBonus;
          if (boss.tier === 3 && lives >= 2) grantUltimate();   // 3번째 보스를 목숨 2개 유지한 채 처치 → 궁극의 필살기 획득
          playSound('boom'); spawnExplosion(boss.x, boss.y, boss.subColor, 30); addShake(7); hitStop = Math.max(hitStop, 6);
          enemyBullets.length = 0;                                                      // 남은 탄막 제거
          clearEnemiesForEvent();                                                       // 잔여 적기 정리 (화면 밖 적은 조용히 제거)
          missiles.forEach(ms => spawnExplosion(ms.x, ms.y, '#ec4899', 6)); missiles.length = 0;
        }
      }

      updateMidBoss();   // 중간 보스 (이동·레이저·피격·처치)

      // 적 탄환 업데이트
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (i >= enemyBullets.length) continue;
        const eb = enemyBullets[i]; 
        if (!eb) continue;
        eb.x += eb.vx; eb.y += eb.vy; 
        const r = eb.r || 4.5;
        
        drawHighVisibilityEnemyBullet(eb);
        
        // 동료2 방어막: 방어막 반경에 닿은 탄환은 피해 없이 소멸
        if (companions.dog.active && Math.hypot(player.x - eb.x, player.y - eb.y) < SHIELD_R + r) {
          shieldFlash = 8; spawnExplosion(eb.x, eb.y, '#67e8f9', 3);
          if (frame - lastShieldSfx > 10) { lastShieldSfx = frame; playSound('shield'); }
          enemyBullets.splice(i, 1);
          continue;
        }
        if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + r) { 
          enemyBullets.splice(i, 1); 
          applyDamage(20); 
          if (enemyBullets.length === 0) break;
          continue; 
        }
        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20 || eb.y < -20) enemyBullets.splice(i, 1);
      }

      // 일반 적 스폰
      const spawnOk = stagePhase === 'FIGHT' || stagePhase === 'BOSS' || (stagePhase === 'INTRO' && phaseTimer < PHASE_FRAMES.INTRO - 50);
      if (spawnOk && frame % (boss || midBoss ? 70 : 32) === 0) enemies.push({ x: Math.random() * (canvas.width - 70) + 45, y: -30, hp: 1, speed: 3.2 + Math.random() * 1.5 });
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (i >= enemies.length) continue;
        const e = enemies[i]; 
        if (!e) continue;
        e.y += e.speed;
        drawMob(e);

        if (e.hp > 0 && Math.random() < 0.008) {   // 이미 격추된 적은 발사하지 않음
          enemyBullets.push({ x: e.x, y: e.y + 17, vx: 0, vy: 2.2, color: '#f43f5e', r: 4 });   // 전투기 기수(기관포)에서 발사되는 일반 총알
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j]; if (enemyInView(e) && Math.hypot(b.x - e.x, b.y - e.y) < 22) { bullets.splice(j, 1); if (e.hp > 0) lifestealHit(e.x, e.y, MOB_HIT_VALUE); e.hp = 0; break; }
        }
        for (let m = missiles.length - 1; m >= 0; m--) {
          const ms = missiles[m]; if (enemyInView(e) && Math.hypot(ms.x - e.x, ms.y - e.y) < 24) { missiles.splice(m, 1); if (e.hp > 0) lifestealHit(e.x, e.y, MOB_HIT_VALUE); e.hp = 0; break; }
        }
        if (companions.dog.active && enemyInView(e) && Math.hypot(player.x - e.x, player.y - e.y) < SHIELD_R + 20) e.hp = 0;   // 방어막에 부딪힌 적 전투기는 파괴
        if (e.hp <= 0) {
          playSound('boom'); spawnExplosion(e.x, e.y, '#ef4444', 12); addRing(e.x, e.y, '#fca5a5', 30, 14); score += 10;
          
          const drop = maybeDropCompanion(e.x, e.y) ? null : rollItemDrop(Math.random());   // 동료 아이템이 나왔으면 일반 아이템은 생략
          if (drop) items.push({ x: e.x, y: e.y, type: drop });

          enemies.splice(i, 1); continue;
        }
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + 14) { 
          enemies.splice(i, 1); 
          applyDamage(35); 
          continue; 
        }
        if (e.y > canvas.height + 30) enemies.splice(i, 1);
      }

      // 아이템 업데이트
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.y += it.type === 'H' ? 1.5 : 2.2;
        const comp = companionOfItem(it.type);
        if (comp) drawCompanionItem(it, comp);
        else if (it.type === 'H') drawHeartItem(it);
        else {
          ctx.fillStyle = it.type === 'M' ? '#ec4899' : it.type === 'E' ? '#06b6d4' : it.type === 'B' ? '#ef4444' : '#10b981';
          ctx.beginPath(); ctx.arc(it.x, it.y, 12, 0, Math.PI * 2); ctx.fill();
          ctx.save(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.type, it.x, it.y); ctx.restore();
        }

        if (Math.hypot(player.x - it.x, player.y - it.y) < player.radius + (comp ? 17 : it.type === 'H' ? 20 : 12)) {
          if (comp) collectCompanion(comp);
          else if (it.type === 'H') collectHeart();
          else if (it.type === 'P') weaponLevel = Math.min(3, weaponLevel + 1);
          else if (it.type === 'M') { hasHomingMissile = true; missileTimer = 500; }
          else if (it.type === 'E') { playSound('heal'); player.energy = Math.min(player.maxEnergy, player.energy + 30); spawnExplosion(player.x, player.y, '#06b6d4', 10); }
          else if (it.type === 'B') { 
            playSound('item'); 
            bombs = Math.min(2, bombs + 1); 
            spawnExplosion(player.x, player.y, '#ef4444', 10); 
          }
          items.splice(i, 1);
        } else if (it.y > canvas.height + 20) items.splice(i, 1);
      }

      // 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy;
        if (pt.drag && pt.drag !== 1) { pt.vx *= pt.drag; pt.vy *= pt.drag; }
        pt.alpha -= (pt.fade || 0.035);
        // 화면 밖으로 나간 파티클은 즉시 제거 (먼 좌표에 글로우를 그리면 매우 느려짐)
        if (pt.x < -40 || pt.x > canvas.width + 40 || pt.y < -40 || pt.y > canvas.height + 40) { particles.splice(i, 1); continue; }
        if (pt.alpha <= 0) particles.splice(i, 1);
        else if (pt.glow) {
          const g = glowSprite(pt.color), d = pt.r * 5;
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, pt.alpha);
          ctx.drawImage(g, pt.x - d / 2, pt.y - d / 2, d, d); ctx.restore();
        }
        else { ctx.save(); ctx.globalAlpha = pt.alpha; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
      }

      drawDamageFlash();               // 피격 붉은 화면
      drawStageOverlay();
      drawHUD();
      drawRespawnNotice();
      if (ult.phase === 'IMPACT') { updateUltimate(); drawUltimate(); }   // 충격 후 손바닥 잔상·섬광·충격파
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
